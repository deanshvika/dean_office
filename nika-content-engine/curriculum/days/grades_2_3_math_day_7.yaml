# ── מחזור 3 · יום 7 · חשבון · שכבות ב-ג ─────────────────────────────
# עולם תוכן: גוף ובריאות | ערך: התמדה
# שכבות ב-ג = ללא ניקוד. מתחילים=ערך מקום · ממשיכים=חיבור/חיסור אנכי · אתגר=כפל(מערך)+בעיה
# ★ כפל משתמש בפריטי-אימוג'י (חלקי גוף) מהבנק.

day_id: grades_2_3_math_day_7
subject: math
audience: grades_2_3
niqqud: false
day_label: "יום 7 – הגוף: ערך מקום, חיבור/חיסור וכפל"
title: "מתעמלים וסופרים"
core_skill: "ערך מקום, חיבור/חיסור אנכי ותחילת כפל"
subskills:
  - "עשרות ויחידות עד 100"
  - "חיבור/חיסור אנכי עם המרה"
  - "כפל כמערך (שורות × עמודות)"

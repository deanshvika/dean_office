leading_value: "התמדה"

pages:

  # ── עמוד 1 · מתחילים · ערך מקום ─────────────────────────────
  beginner:
    level: beginner
    intro: "במרכז הספורט סופרים כמה ילדים התאמנו. כדי לדעת בדיוק — מפרקים כל מספר לעשרות ויחידות."
    instruction: "הסתכלו על העשרות (פסים) והיחידות (ריבועים), וסמנו את המספר הנכון."
    example:
      type: place_value
      number: 24
      ask: total
      options: [22, 24, 26]
      caption: "2 עשרות ו-4 יחידות. בסך הכול 24."
    tasks:
      - { type: place_value, number: 36, ask: total, options: [34, 36, 38] }
      - { type: place_value, number: 42, ask: tens,  options: [2, 4, 6] }
      - { type: place_value, number: 58, ask: units, options: [5, 8, 9] }
      - { type: place_value, number: 27, ask: total, options: [25, 27, 29] }
    encouraging_message: "כשמפרקים מספר לעשרות ויחידות, קל יותר לספור נכון בלי להתבלבל."
    quick_check:
      type: place_value
      number: 45
      ask: total
      options: [43, 45, 47]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "בחרו מספר בין 20 ל-50 וציירו אותו בעשרות ויחידות."
    footer: "בניקה מתמידים — סופרים מדויק ומקשיבים לגוף."

  # ── עמוד 2 · ממשיכים · חיבור/חיסור אנכי ─────────────────────────────
  mid:
    level: mid
    intro: "עכשיו נחשב כמה תרגילים עשו יחד, וכמה נשארו. נחבר ונחסר בטור."
    instruction: "פתרו את התרגילים בטור. שימו לב להמרה (עשרת שלמה)."
    example:
      type: vertical_arith
      op: addition
      a: 47
      b: 25
      result: 72
      prompt: "בבוקר עשו 47 קפיצות ובצהריים 25. כמה קפיצות יחד?"
    tasks:
      - { type: vertical_arith, op: addition,    a: 38, b: 26, result: 64, prompt: "38 סקוואטים ועוד 26." }
      - { type: vertical_arith, op: subtraction, a: 53, b: 27, result: 26, prompt: "תכננו 53 שכיבות, עשו כבר 27." }
      - { type: vertical_arith, op: addition,    a: 64, b: 29, result: 93, prompt: "64 צעדים ועוד 29." }
      - { type: vertical_arith, op: subtraction, a: 82, b: 45, result: 37, prompt: "82 דקות אימון, עברו 45." }
    encouraging_message: "כשמחשבים בטור בזהירות ומתמידים, מגיעים לתוצאה הנכונה."
    quick_check:
      type: vertical_arith
      op: addition
      a: 46
      b: 38
      result: 84
      prompt: "כמה יחד: 46 ועוד 38?"
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "המציאו תרגיל חיבור בטור שהתשובה שלו היא 90."
    footer: "בניקה מתקדמים יחד — מחשבים מדויק ומתמידים."

  # ── עמוד 3 · אתגר · כפל כמערך + בעיה ─────────────────────────────
  challenge:
    level: challenge
    intro: "כשיש כמה קבוצות שוות, כפל עוזר לספור מהר. נסדר בשורות ועמודות ונכפול."
    instruction: "ספרו את המערך, וכתבו את תרגיל הכפל."
    example:
      type: multiply
      rows: 3
      cols: 4
      item: hand
      result: 12
      prompt: "3 שורות, בכל אחת 4 ידיים מורמות. כמה ידיים בסך הכול?"
    tasks:
      - { type: multiply, rows: 2, cols: 5, item: finger, result: 10, prompt: "2 שורות של 5 אצבעות. כמה אצבעות?" }
      - { type: multiply, rows: 4, cols: 3, item: leg,    result: 12, prompt: "4 קבוצות, בכל אחת 3 רגליים. כמה רגליים?" }
    encouraging_message: "התמדה היא לחזור על התרגיל שוב ושוב עד שמצליחים — יפה שהתאמצתם."
    quick_check:
      type: vertical_arith
      op: addition
      a: 156
      b: 128
      result: 284
      prompt: "בבוקר התאמנו 156 ילדים, אחר הצהריים עוד 128. כמה יחד?"
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "המציאו בעיית כפל על אימון (למשל: 5 קבוצות × 2 כדורים)."
    footer: "בניקה אנחנו מתקדמים — כל יום צעד קטן קדימה, ביחד."


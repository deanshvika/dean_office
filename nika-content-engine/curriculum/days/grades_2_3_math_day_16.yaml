# ── מחזור 6 · יום 16 · חשבון · שכבות ב-ג ─────────────────────────────
# עולם תוכן: טבע וסביבה | ערך: שמירה על הסביבה
# שכבות ב-ג = ללא ניקוד. מתחילים=ערך מקום · ממשיכים=חיבור/חיסור אנכי · אתגר=כפל(מערך)+בעיה
# ★ כפל משתמש בפריטי-אימוג'י (טבע) מהבנק.

day_id: grades_2_3_math_day_16
subject: math
audience: grades_2_3
niqqud: false
day_label: "יום 16 – טבע: ערך מקום, חיבור/חיסור וכפל"
title: "סופרים ושומרים על הטבע"
core_skill: "ערך מקום, חיבור/חיסור אנכי ותחילת כפל"
subskills:
  - "עשרות ויחידות עד 100"
  - "חיבור/חיסור אנכי עם המרה"

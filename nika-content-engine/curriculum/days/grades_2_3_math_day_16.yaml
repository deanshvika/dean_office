pages:

  # ── עמוד 1 · מתחילים · ערך מקום ─────────────────────────────
  beginner:
    level: beginner
    intro: "בפרויקט הנטיעות סופרים כמה עצים שתלו. כדי לדעת בדיוק — מפרקים כל מספר לעשרות ויחידות."
    instruction: "הסתכלו על העשרות (פסים) והיחידות (ריבועים), וסמנו את המספר הנכון."
    example:
      type: place_value
      number: 24
      ask: total
      options: [22, 24, 26]
      caption: "2 עשרות ו-4 יחידות. בסך הכול 24."
    tasks:
      - { type: place_value, number: 38, ask: total, options: [36, 38, 40] }
      - { type: place_value, number: 47, ask: tens,  options: [4, 5, 7] }
      - { type: place_value, number: 59, ask: units, options: [5, 9, 10] }
      - { type: place_value, number: 26, ask: total, options: [24, 26, 28] }
    encouraging_message: "כשמפרקים מספר לעשרות ויחידות, קל יותר לספור נכון ולשמור על סדר בטבע."
    quick_check:
      type: place_value
      number: 44
      ask: total
      options: [42, 44, 46]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "בחרו מספר בין 20 ל-50 וציירו אותו בעשרות ויחידות."
    footer: "בניקה סופרים מדויק — שומרים על טבע נקי וירוק."

  # ── עמוד 2 · ממשיכים · חיבור/חיסור אנכי ─────────────────────────────
  mid:
    level: mid
    intro: "עכשיו נחשב כמה עצים ופרחים שתלו יחד, וכמה נשארו. נחבר ונחסר בטור."
    instruction: "פתרו את התרגילים בטור. שימו לב להמרה (עשרת שלמה)."
    example:
      type: vertical_arith
      op: addition
      a: 47
      b: 25
      result: 72
      prompt: "בבוקר שתלו 47 עצים ובצהריים 25. כמה עצים יחד?"
    tasks:
      - { type: vertical_arith, op: addition,    a: 38, b: 26, result: 64, prompt: "38 פרחים ועוד 26." }
      - { type: vertical_arith, op: subtraction, a: 53, b: 27, result: 26, prompt: "היו 53 שתילים, נטעו 27." }
      - { type: vertical_arith, op: addition,    a: 64, b: 29, result: 93, prompt: "64 עצים ועוד 29." }
      - { type: vertical_arith, op: subtraction, a: 82, b: 45, result: 37, prompt: "82 בקבוקים למיחזור, מיחזרו 45." }
    encouraging_message: "כשמחשבים בטור בזהירות, שומרים על הטבע ומגיעים לתוצאה הנכונה."
    quick_check:
      type: vertical_arith
      op: addition
      a: 46
      b: 38
      result: 84
      prompt: "כמה יחד: 46 ועוד 38?"
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "המציאו תרגיל חיבור בטור שהתשובה שלו היא 90."
    footer: "בניקה מתקדמים יחד — מחשבים מדויק ושומרים על הטבע."

  # ── עמוד 3 · אתגר · כפל כמערך + בעיה ─────────────────────────────
  challenge:
    level: challenge
    intro: "כששותלים עצים בשורות שוות, כפל עוזר לספור מהר. נסדר בשורות ועמודות ונכפול."
    instruction: "ספרו את המערך, וכתבו את תרגיל הכפל."
    example:
      type: multiply
      rows: 3
      cols: 4
      item: tree
      result: 12
      prompt: "3 שורות, בכל אחת 4 עצים. כמה עצים בסך הכול?"
    tasks:
      - { type: multiply, rows: 2, cols: 5, item: flower, result: 10, prompt: "2 ערוגות של 5 פרחים. כמה פרחים?" }
      - { type: multiply, rows: 4, cols: 3, item: leaf,   result: 12, prompt: "4 ענפים, בכל אחד 3 עלים. כמה עלים?" }
    encouraging_message: "שמירה על הטבע היא לטפח כל עץ וכל פרח — יפה שסידרתם וספרתם בדיוק."
    quick_check:
      type: vertical_arith
      op: addition
      a: 156
      b: 128
      result: 284
      prompt: "בבוקר שתלו 156 עצים, אחר הצהריים עוד 128. כמה יחד?"
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "המציאו בעיית כפל על הטבע (למשל: 5 ערוגות × 2 פרחים)."
    footer: "בניקה אנחנו מתקדמים — כל יום צעד קטן קדימה, ביחד."

  # ── דף מדריך/ה ─────────────────────────────

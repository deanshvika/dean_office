# ── מחזור 4 · יום 11 · שפה · שכבה א' ─────────────────────────────
# עולם תוכן: אוכל בריא | ערך: בחירה נבונה
# דרגות קושי: מתחילים=מילה→תמונה · ממשיכים=תמונה→מילה · אתגר=אות חסרה
# ★ בידול מ"אנגלית": עברית על סט תפוח/בננה/גזר/לימון/תירס (אנגלית על milk/egg/grapes/orange/cheese).
# שפה שכבה א' = ניקוד מלא; מילים ואותיות מהבנק המנוקד.

day_id: grade_1_language_day_11
subject: language
audience: grade_1
niqqud: true
day_label: "יוֹם 11 – אֹכֶל בָּרִיא: מִלָּה, תְּמוּנָה וְאוֹת"
title: "בּוֹחֲרִים אֹכֶל בָּרִיא"
core_skill: "זיהוי מילה, קריאתה, וניתוח האות החסרה — בעולם המזון"
subskills:
  - "התאמת מילה לתמונה של מאכל"
  - "קריאת מילה ובחירתה"
  - "זיהוי אות חסרה במילה"
theme: "אוכל בריא"
leading_value: "בחירה נבונה"

pages:

  # ── עמוד 1 · מתחילים · מילה → תמונה ─────────────────────────────
  beginner:
    level: beginner
    intro: "יֵשׁ הַרְבֵּה מַאֲכָלִים בְּרִיאִים. בּוֹאוּ נַכִּיר אוֹתָם וְנִלְמַד לִבְחֹר נָכוֹן."
    instruction: "קִרְאוּ אֶת הַמִּלָּה, וְהַקִּיפוּ אֶת הַתְּמוּנָה הַמַּתְאִימָה."
    example:
      type: word_picture
      item: apple
      distractors: [carrot, banana]
      caption: "מַקִּיפִים אֶת הַתְּמוּנָה הַמַּתְאִימָה."
    tasks:
      - { type: word_picture, item: banana, distractors: [apple, corn] }
      - { type: word_picture, item: carrot, distractors: [lemon, banana] }
      - { type: word_picture, item: lemon,  distractors: [corn, apple] }
      - { type: word_picture, item: corn,   distractors: [banana, carrot] }
    encouraging_message: "כְּשֶׁאֲנַחְנוּ מַכִּירִים אֹכֶל בָּרִיא, קַל יוֹתֵר לִבְחֹר נָכוֹן."
    quick_check:
      type: word_picture
      item: apple
      distractors: [lemon, corn]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "הַרְאוּ מַאֲכָל בָּרִיא אֶחָד וְאִמְרוּ אֶת הַשֵּׁם שֶׁלּוֹ."
    footer: "בְּנִיקָה מִתְקַדְּמִים יַחַד — קוֹרְאִים, מְנַסִּים וּבוֹחֲרִים בָּרִיא."

  # ── עמוד 2 · ממשיכים · תמונה → מילה ─────────────────────────────
  mid:
    level: mid
    intro: "עַכְשָׁיו נִסְתַּכֵּל עַל הַתְּמוּנָה וְנִבְחַר אֶת הַמִּלָּה הַנְּכוֹנָה."
    instruction: "הִסְתַּכְּלוּ עַל הַתְּמוּנָה וְסַמְּנוּ אֶת הַמִּלָּה הַמַּתְאִימָה."
    example:
      type: pic_word
      item: apple
      distractors: [carrot, lemon]
      caption: "בּוֹחֲרִים אֶת הַמִּלָּה הַמַּתְאִימָה לַתְּמוּנָה."
    tasks:
      - { type: pic_word, item: banana, distractors: [apple, corn] }
      - { type: pic_word, item: carrot, distractors: [lemon, banana] }
      - { type: pic_word, item: corn,   distractors: [apple, carrot] }
      - { type: pic_word, item: lemon,  distractors: [banana, corn] }
    encouraging_message: "כְּשֶׁאֲנַחְנוּ מְנַסִּים שׁוּב וּבוֹחֲרִים בִּתְבוּנָה, אֲנַחְנוּ לוֹמְדִים וּמִתְקַדְּמִים."
    quick_check:
      type: pic_word
      item: carrot
      distractors: [apple, lemon]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "אִמְרוּ מִלָּה שֶׁל מַאֲכָל לְחָבֵר, וּבִדְקוּ אִם מָצָא אוֹתָהּ."
    footer: "בְּנִיקָה מִתְקַדְּמִים יַחַד — מְנַסִּים, בּוֹחֲרִים וְלוֹמְדִים."

  # ── עמוד 3 · אתגר · אות חסרה ─────────────────────────────
  challenge:
    level: challenge
    intro: "עַכְשָׁיו נִמְצָא אֵיזוֹ אוֹת חֲסֵרָה בְּשֵׁם הַמַּאֲכָל, וְנַשְׁלִים אוֹתָהּ."
    instruction: "הַשְׁלִימוּ אֶת הָאוֹת הַחֲסֵרָה בְּכָל מִלָּה."
    example:
      type: missing_letter
      item: apple
      answer: "פ"
      options: ["פ", "מ", "ל"]
      caption: "מַשְׁלִימִים אֶת הָאוֹת הַחֲסֵרָה בַּמִּלָּה."
    tasks:
      - { type: missing_letter, item: banana, answer: "ב", options: ["ב", "ש", "ת"] }
      - { type: missing_letter, item: carrot, answer: "ז", options: ["ז", "מ", "ת"] }
      - { type: missing_letter, item: lemon,  answer: "מ", options: ["מ", "ב", "ס"] }
    encouraging_message: "מַאֲמָץ, קְרִיאָה וּבְחִירָה נְבוֹנָה עוֹזְרִים לָנוּ לְהִשְׁתַּפֵּר בְּכָל יוֹם."
    quick_check:
      type: missing_letter
      item: corn
      answer: "ס"
      options: ["ס", "מ", "ל"]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "הַמְצִיאוּ מִשְׁפָּט קָצָר עַל מַאֲכָל בָּרִיא שֶׁאַתֶּם אוֹהֲבִים."
    footer: "בְּנִיקָה אֲנַחְנוּ מִתְקַדְּמִים — כָּל יוֹם צַעַד קָטָן קָדִימָה."

  # ── דף מדריך/ה (ללא ניקוד) ─────────────────────────────
  coach_guide:
    daily_goal:
      - "התאמת שם מאכל לתמונה (זיהוי)"
      - "בחירת המילה הנכונה לפי תמונה (קריאה)"
      - "זיהוי והשלמת אות חסרה (ניתוח)"
      - "חיזוק הקשר בין צליל, אות ומילה"
    leading_value:
      name: "בחירה נבונה"
      text: "היכרות עם שמות המאכלים הבריאים עוזרת לילד לבחור נכון — בחירה נבונה מתחילה בהכרה."
    pages_overview:
      - level: beginner
        audience: "מיועד לילדים שצריכים כניסה פשוטה:"
        points: ["שמיעת מילה", "זיהוי המאכל המתאים", "בחירה בין 3 אפשרויות"]
      - level: mid
        audience: "מיועד לילדים שיכולים:"
        points: ["להסתכל על תמונה ולקרוא", "לבחור את המילה הנכונה", "להבחין בין מילים דומות"]
      - level: challenge
        audience: "מיועד לילדים שיכולים:"
        points: ["לקרוא מילה בביטחון יחסי", "לזהות איזו אות חסרה", "להשלים את המילה"]
    how_to_mediate:
      - "לפתוח תמיד מהפתיח ומהדוגמה"
      - "לומר את שם המאכל בקול ברור ולבקש מהילד לחזור"
      - "בעמוד האות החסרה — לקרוא את המילה בלי האות ולשאול 'איזה צליל חסר?'"
      - "לחבר לערך: 'למה כדאי לבחור את המאכל הזה?'"
      - "אם צריך, להישאר רק בעמוד 'מתחילים'"
    adaptations:
      - "להציג משימה אחת בכל פעם"
      - "לומר את המילה בקול שוב ושוב"
      - "להשתמש בכרטיסיות מילה/אות נפרדות"
      - "להקטין מספר אפשרויות אם צריך"
      - "לאפשר תשובה בהצבעה או בעל פה"
    fast_finishers:
      - "לעבור ל'אתגר'"
      - "לתת את הבונוס"
      - "לבקש לומר שם מאכל בריא נוסף"
      - "לבקש לייצר משפט קצר מאוד"
    coach_message:
      lead: "הדגש הוא לא על 'קריאה מושלמת', אלא על:"
      values: ["בחירה נבונה", "קריאה", "חזרתיות", "ביטחון"]
    phrases:
      - "כל הכבוד שקראת."
      - "יפה שבחרת נכון."
      - "מצאת את האות החסרה."
      - "קראת שוב וזה מעולה."
      - "התקדמת יפה."
    footer_legend: ["בחירה נבונה", "קריאה", "חזרתיות", "ביטחון", "תחושת הצלחה"]

# ── מחזור 4 · יום 12 · אנגלית · שכבה א' ─────────────────────────────
# עולם תוכן: אוכל בריא | ערך: שיתוף
# בידול מ"שפה" (#11): אנגלית על סט milk/egg/grapes/orange/cheese
#   (עברית עובדת על תפוח/בננה/גזר/לימון/תירס). כמעט בלי חפיפה → לא תרגום.
# מדיניות: הוראות/פתיח עברית מנוקדות; אנגלית plain. פריטי-אימוג'י מהבנק.

day_id: grade_1_english_day_12
subject: english
audience: grade_1
niqqud: true
day_label: "יוֹם 12 – Food: Words and Pictures"
title: "Healthy food"
core_skill: "אוצר מילים באנגלית: זיהוי מילה↔תמונה (אוכל)"
subskills:
  - "התאמת מילה באנגלית לתמונה של מאכל"
  - "בחירת המילה הנכונה לפי תמונה"
  - "זיהוי מילה מבין ארבע אפשרויות"
theme: "אוכל בריא"
leading_value: "שיתוף"

pages:

  # ── עמוד 1 · מתחילים · word → picture ─────────────────────────────
  beginner:
    level: beginner
    intro: "לַמַּאֲכָלִים יֵשׁ שֵׁמוֹת גַּם בְּאַנְגְּלִית. בּוֹאוּ נַכִּיר אוֹתָם וְנִלְמַד לְשַׁתֵּף."
    instruction: "Read or listen to the word. Circle the matching picture."
    example:
      type: word_picture
      item: milk
      word: "milk"
      word_label: "Word:"
      distractors: [egg, cheese]
      caption: "Circle: milk"
    tasks:
      - { type: word_picture, item: egg,    word: "egg",    word_label: "Word:", distractors: [orange, milk] }
      - { type: word_picture, item: orange, word: "orange", word_label: "Word:", distractors: [grapes, egg] }
      - { type: word_picture, item: grapes, word: "grapes", word_label: "Word:", distractors: [milk, cheese] }
      - { type: word_picture, item: cheese, word: "cheese", word_label: "Word:", distractors: [egg, orange] }
    encouraging_message: "In NIKA we share our food. We learn its names together."
    quick_check:
      type: word_picture
      item: orange
      word: "orange"
      word_label: "Word:"
      distractors: [milk, egg]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "Point to one food and say its name in English."
    footer: "בְּנִיקָה מִתְקַדְּמִים יַחַד — לוֹמְדִים, מְנַסִּים וּמְשַׁתְּפִים."

  # ── עמוד 2 · ממשיכים · picture → word ─────────────────────────────
  mid:
    level: mid
    intro: "עַכְשָׁיו נִסְתַּכֵּל עַל הַמַּאֲכָל וְנִבְחַר אֶת הַמִּלָּה הַנְּכוֹנָה בְּאַנְגְּלִית."
    instruction: "Look at the food and choose the correct word."
    example:
      type: pic_word
      item: milk
      distractors: [egg, orange]
      caption: "Choose the word for the picture: milk"
    tasks:
      - { type: pic_word, item: egg,    distractors: [cheese, milk] }
      - { type: pic_word, item: orange, distractors: [grapes, egg] }
      - { type: pic_word, item: grapes, distractors: [milk, orange] }
      - { type: pic_word, item: cheese, distractors: [egg, grapes] }
    encouraging_message: "When we look closely, we learn — and we can share what we know."
    quick_check:
      type: pic_word
      item: grapes
      distractors: [milk, egg]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "Point to a food. Can your friend say the word in English?"
    footer: "בְּנִיקָה מִתְקַדְּמִים יַחַד — מְנַסִּים, בּוֹחֲרִים וּמְשַׁתְּפִים."

  # ── עמוד 3 · אתגר · picture → word עם 4 אפשרויות ──────────────────
  challenge:
    level: challenge
    intro: "עַכְשָׁיו נִבְחַר אֶת הַמִּלָּה הַנְּכוֹנָה בְּאַנְגְּלִית מִבֵּין אַרְבַּע מִלִּים."
    instruction: "Look at the food and choose the correct word (4 choices)."
    example:
      type: pic_word
      item: milk
      distractors: [egg, orange, cheese]
      caption: "Choose the word: milk"
    tasks:
      - { type: pic_word, item: orange, distractors: [milk, egg, cheese] }
      - { type: pic_word, item: cheese, distractors: [grapes, orange, egg] }
    encouraging_message: "Great! Everyone can learn the food words."
    quick_check:
      type: pic_word
      item: egg
      distractors: [milk, orange, grapes]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "Name one more food in English you know."
    footer: "בְּנִיקָה אֲנַחְנוּ מִתְקַדְּמִים — כָּל יוֹם צַעַד קָטָן קָדִימָה."

  # ── דף מדריך/ה (ללא ניקוד) ─────────────────────────────
  coach_guide:
    daily_goal:
      - "זיהוי מילה באנגלית לפי תמונה של מאכל"
      - "בחירת המילה הנכונה לפי תמונה"
      - "זיהוי מילה מבין ארבע אפשרויות"
      - "חשיפה מוקדמת ובטוחה לאנגלית (שמיעה+זיהוי)"
    leading_value:
      name: "שיתוף"
      text: "אוכל הוא הזדמנות לשתף — לומדים את שמות המאכלים ומתרגלים לחלוק עם החברים."
    pages_overview:
      - level: beginner
        audience: "מיועד לילדים שצריכים כניסה פשוטה:"
        points: ["שמיעת מילה באנגלית", "זיהוי המאכל המתאים", "בחירה בין 3 אפשרויות"]
      - level: mid
        audience: "מיועד לילדים שיכולים:"
        points: ["להסתכל על תמונה ולבחור מילה", "לזהות שם מאכל באנגלית", "להבחין בין מילים דומות"]
      - level: challenge
        audience: "מיועד לילדים שיכולים:"
        points: ["לזהות מילה מבין ארבע אפשרויות", "להבחין בין שמות מאכלים", "לשמוע/לומר מילה בביטחון"]
    how_to_mediate:
      - "לפתוח תמיד מהפתיח ומהדוגמה"
      - "לומר את שם המאכל באנגלית בקול ולבקש לחזור"
      - "באתגר — להצביע על המאכל ולומר את ארבע המילים לפני הבחירה"
      - "לחבר לערך: 'עם מי היית משתף את המאכל הזה?'"
      - "להקטין מספר אפשרויות אם צריך"
    adaptations:
      - "להציג משימה אחת בכל פעם"
      - "לחזור על המילה כמה פעמים"
      - "לחבר בין המילה למאכל אמיתי (להראות/להצביע)"
      - "לתת בחירה בין שתי תשובות במקום שלוש"
      - "לאפשר לענות בהצבעה"
    fast_finishers:
      - "לעבור ל'אתגר'"
      - "לתת את הבונוס"
      - "לבקש לומר שם מאכל נוסף באנגלית"
      - "לבקש להצביע על מאכל ולומר את שמו"
    coach_message:
      lead: "הדגש הוא לא על 'מבטא מושלם', אלא על:"
      values: ["שיתוף", "ניסיון", "חזרתיות", "ביטחון", "תחושת הצלחה"]
    phrases:
      - "Great try."
      - "You know the food words."
      - "You found the food."
      - "You shared with your friend."
      - "You kept going."
    footer_legend: ["שיתוף", "ניסיון", "חזרתיות", "ביטחון", "תחושת הצלחה"]

# ── מחזור 2 · יום 4 · חשבון · שכבה א' ─────────────────────────────
# עולם תוכן: החי | ערך: אכפתיות וכבוד לכל יצור
# דרגות קושי: מתחילים=מנייה · ממשיכים=השוואה+כתיבה · אתגר=חיבור/חיסור+השלמה
# ★ פריטי-אימוג'י (חיות) מהבנק. חשבון שכבה א' = מנוקד; דף מדריך = ללא ניקוד.

day_id: grade_1_math_day_4
subject: math
audience: grade_1
niqqud: true
day_label: "יוֹם 4 – חַיּוֹת: מְנִיָּה וְכַמּוּת"
title: "כַּמָּה בַּעֲלֵי חַיִּים יֵשׁ?"
core_skill: "מנייה, השוואה ותחילת חיבור/חיסור"
subskills:
  - "ספירה עד 10"
  - "השוואת כמויות (יותר/פחות)"
  - "חיבור/חיסור והשלמה לשוויון"
theme: "החי"
leading_value: "אכפתיות"

pages:

  # ── עמוד 1 · מתחילים · מנייה ─────────────────────────────
  beginner:
    level: beginner
    intro: "בַּחַוָּה יֵשׁ הַרְבֵּה בַּעֲלֵי חַיִּים. בּוֹאוּ נִסְפֹּר כַּמָּה יֵשׁ מִכָּל אֶחָד."
    instruction: "סִפְרוּ אֶת בַּעֲלֵי הַחַיִּים וְסַמְּנוּ אֶת הַמִּסְפָּר הַמַּתְאִים."
    example:
      type: count
      item: cat
      count: 4
      caption: "יֵשׁ 4 חֲתוּלִים. הַמִּסְפָּר הַמַּתְאִים הוּא:"
    tasks:
      - { type: count, item: dog,    count: 5, options: [4, 5, 6] }
      - { type: count, item: fish,   count: 6, options: [5, 6, 7] }
      - { type: count, item: bird,   count: 8, options: [7, 8, 9] }
      - { type: count, item: rabbit, count: 7, options: [6, 7, 8] }
    encouraging_message: "כְּשֶׁסּוֹפְרִים בִּזְהִירוּת, יוֹדְעִים שֶׁלֹּא חָסֵר כְּלוּם לְאַף חַיָּה."
    quick_check:
      type: write_count
      groups:
        - { item: cat, count: 6, line: "סִפְרוּ וְכִתְבוּ: יֵשׁ כָּאן ___ חֲתוּלִים." }
    success_reflection: [tried, improved, persevered]
    bonus:
      type: find_count
      target: 5
      text: "מִצְאוּ צִיּוּר אֶחָד שֶׁבּוֹ יֵשׁ בְּדִיּוּק 5 חַיּוֹת."
    footer: "בְּנִיקָה דּוֹאֲגִים לְכָל יְצוּר — סוֹפְרִים, מְדַיְּקִים וְשׁוֹמְרִים."

  # ── עמוד 2 · ממשיכים · השוואה + כתיבה ─────────────────────────────
  mid:
    level: mid
    intro: "עַכְשָׁיו נִבְדֹּק כַּמָּה חַיּוֹת יֵשׁ, וְנִרְאֶה אֵיפֹה יֵשׁ יוֹתֵר וְאֵיפֹה יֵשׁ פָּחוֹת."
    instruction: "סִפְרוּ, כִּתְבוּ אֶת הַמִּסְפָּרִים, וְסַמְּנוּ אֵיפֹה יֵשׁ יוֹתֵר אוֹ פָּחוֹת."
    example:
      type: compare
      item: cat
      a: 4
      b: 3
      ask: more
      caption: "בִּקְבוּצָה א׳ יֵשׁ 4 חֲתוּלִים, בִּקְבוּצָה ב׳ יֵשׁ 3. בִּקְבוּצָה א׳ יֵשׁ יוֹתֵר."
    tasks:
      - type: write_count
        groups:
          - { item: dog, count: 5, line: "בִּקְבוּצָה א׳ יֵשׁ ___" }
          - { item: dog, count: 3, line: "בִּקְבוּצָה ב׳ יֵשׁ ___" }
      - { type: compare, item: fish, a: 5, b: 3, ask: more }
      - { type: compare, item: rabbit, a: 4, b: 6, ask: less }
      - type: write_count
        groups:
          - { item: bird, count: 5, line: "יֵשׁ ___ צִפּוֹרִים" }
          - { item: fish, count: 6, line: "יֵשׁ ___ דָּגִים" }
      - type: match
        prompt: "חַבְּרוּ בְּקַו בֵּין כָּל קְבוּצָה לַמִּסְפָּר הַמַּתְאִים."
        pairs:
          - { item: cat,    count: 2, label: "קְבוּצָה א׳" }
          - { item: rabbit, count: 4, label: "קְבוּצָה ב׳" }
          - { item: dog,    count: 5, label: "קְבוּצָה ג׳" }
        numbers: [4, 2, 5]
    encouraging_message: "כְּשֶׁאֲנַחְנוּ בּוֹדְקִים בְּיַחַד מִי צָרִיךְ עוֹד — אַף חַיָּה לֹא נִשְׁאֶרֶת בְּלִי טִפּוּל."
    quick_check:
      type: compare
      item: fish
      a: 5
      b: 3
      ask: more
      line: "סַמְּנוּ: לְאֵיזוֹ קְבוּצָה יֵשׁ יוֹתֵר דָּגִים?"
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      title: "אֶתְגָּר זוּגִי"
      text: "בִּדְקוּ עִם חָבֵר אוֹ חֲבֵרָה אִם סְפַרְתֶּם אוֹתוֹ דָּבָר."
    footer: "בְּנִיקָה מִתְקַדְּמִים יַחַד — סוֹפְרִים, בּוֹדְקִים וְדוֹאֲגִים לְכָל יְצוּר."

  # ── עמוד 3 · אתגר · חיבור/חיסור + השלמה ─────────────────────────────
  challenge:
    level: challenge
    intro: "עַכְשָׁיו נַחְשֹׁב כְּמוֹ מְטַפְּלִים שֶׁאַחְרָאִים לַחַיּוֹת — נְחַבֵּר, נְחַסֵּר וְנַשְׁלִים."
    instruction: "סִפְרוּ, חִשְׁבוּ, וְהַשְׁלִימוּ אֶת הַתְּשׁוּבוֹת."
    example:
      type: arith
      op: addition
      a: { item: cat, count: 4 }
      b: { item: cat, count: 3 }
      result: 7
      caption: "בַּגִּנָּה 4 חֲתוּלִים, וְהִגִּיעוּ עוֹד 3. כַּמָּה חֲתוּלִים יֵשׁ בְּיַחַד?"
    tasks:
      - type: arith
        op: addition
        a: { item: dog, count: 4 }
        b: { item: dog, count: 2 }
        result: 6
        prompt: "הָיוּ 4 כְּלָבִים, וְהִגִּיעוּ עוֹד 2. כַּמָּה כְּלָבִים יֵשׁ בְּיַחַד?"
      - type: arith
        op: subtraction
        a: { item: bird, count: 6 }
        b: { item: bird, count: 2 }
        result: 4
        prompt: "הָיוּ 6 צִפּוֹרִים, 2 עָפוּ. כַּמָּה צִפּוֹרִים נִשְׁאֲרוּ?"
      - type: equalize
        item: fish
        a: 5
        b: 3
        answer: 2
        prompt: "בִּקְבוּצָה א׳ 5 דָּגִים, בִּקְבוּצָה ב׳ 3. כַּמָּה דָּגִים לְהוֹסִיף כְּדֵי שֶׁיִּהְיֶה שָׁוֶה?"
    encouraging_message: "לָדַעַת לִסְפֹּר עוֹזֵר לָנוּ לִדְאֹג שֶׁלְּכָל חַיָּה יִהְיֶה מַסְפִּיק — יָפֶה שֶׁחֲשַׁבְתֶּם עֲלֵיהֶן."
    quick_check:
      type: arith
      op: addition
      a: { item: cat, count: 3 }
      b: { item: cat, count: 2 }
      result: 5
      prompt: "כִּתְבוּ: 3 חֲתוּלִים וְעוֹד 2 חֲתוּלִים — כַּמָּה בְּיַחַד?"
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "הַמְצִיאוּ שְׁאֵלָה חֲדָשָׁה עַל אַחַת הַחַיּוֹת בַּדַּף."
    footer: "בְּנִיקָה אֲנַחְנוּ מִתְקַדְּמִים — כָּל יוֹם צַעַד קָטָן קָדִימָה, בְּיַחַד."

  # ── דף מדריך/ה (ללא ניקוד) ─────────────────────────────
  coach_guide:
    daily_goal:
      - "מנייה עד 10"
      - "השוואת כמויות (יותר/פחות)"
      - "חיבור וחיסור עד 10"
      - "השלמה לשוויון בין קבוצות"
    leading_value:
      name: "אכפתיות"
      text: "ספירה מדויקת עוזרת לילד להבין שהוא אחראי שלכל בעל חיים יהיה מספיק — אוכל, מקום ותשומת לב."
    pages_overview:
      - level: beginner
        audience: "מיועד לילדים שצריכים כניסה פשוטה ובטוחה:"
        points: ["ספירה עד 10", "התאמת כמות למספר", "סימון התשובה הנכונה"]
      - level: mid
        audience: "מיועד לילדים שיכולים:"
        points: ["לספור באופן עצמאי", "לכתוב מספר", "להשוות יותר/פחות ולחבר בקו"]
      - level: challenge
        audience: "מיועד לילדים שיכולים:"
        points: ["לחבר ולחסר עד 10", "לפתור בעיה מילולית קצרה", "להבין מה חסר כדי להגיע לשוויון"]
    how_to_mediate:
      - "לפתוח תמיד מהפתיח ומהדוגמה"
      - "לבקש מהילד להצביע על כל חיה תוך כדי ספירה"
      - "לעבוד לאט ובהצלחה, בלי למהר"
      - "לחבר את המספר לערך: 'ספרנו כדי לדאוג לכל החיות'"
      - "אם צריך, להישאר רק בעמוד 'מתחילים'"
    adaptations:
      - "לכסות חלקים אחרים בדף ולהציג רק משימה אחת בכל פעם"
      - "לספור יחד בקול"
      - "להשתמש באצבע או בטוש מחיק למעקב"
      - "לתת בחירה בין שתי תשובות במקום שלוש אם צריך"
      - "לאפשר לענות בעל פה"
    fast_finishers:
      - "לעבור ל'אתגר'"
      - "לתת את הבונוס"
      - "לבקש מהילד להמציא שאלה משלו"
      - "לבקש ממנו להסביר איך חשב"
    coach_message:
      lead: "הדגש הוא לא רק על מספר נכון, אלא על:"
      values: ["דיוק", "אכפתיות", "התמדה", "דאגה לחלש"]
    phrases:
      - "כל הכבוד שספרת בזהירות."
      - "ראיתי שהתמדת."
      - "בדקת שוב וזה מעולה."
      - "אכפת לך מהחיות."
      - "התקדמת יפה."
    footer_legend: ["אכפתיות", "כבוד לכל יצור", "מאמץ", "התמדה", "דאגה לחלש"]

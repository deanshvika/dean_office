# ── מחזור 4 · יום 10 · חשבון · שכבות ב-ג ─────────────────────────────
# עולם תוכן: אוכל בריא | ערך: מידה ואיזון
# שכבות ב-ג = ללא ניקוד. מתחילים=ערך מקום · ממשיכים=חיבור/חיסור אנכי · אתגר=כפל(מערך)+בעיה
# ★ כפל משתמש בפריטי-אימוג'י (מזון) מהבנק.

day_id: grades_2_3_math_day_10
subject: math
audience: grades_2_3
niqqud: false
day_label: "יום 10 – אוכל בריא: ערך מקום, חיבור/חיסור וכפל"
title: "סופרים ומאזנים במטבח"
core_skill: "ערך מקום, חיבור/חיסור אנכי ותחילת כפל"
subskills:
  - "עשרות ויחידות עד 100"
  - "חיבור/חיסור אנכי עם המרה"
  - "כפל כמערך (שורות × עמודות)"
theme: "אוכל בריא"
leading_value: "מידה ואיזון"

pages:

  # ── עמוד 1 · מתחילים · ערך מקום ─────────────────────────────
  beginner:
    level: beginner
    intro: "במחסן המזון סופרים כמה פירות הגיעו. כדי לדעת בדיוק — מפרקים כל מספר לעשרות ויחידות."
    instruction: "הסתכלו על העשרות (פסים) והיחידות (ריבועים), וסמנו את המספר הנכון."
    example:
      type: place_value
      number: 24
      ask: total
      options: [22, 24, 26]
      caption: "2 עשרות ו-4 יחידות. בסך הכול 24."
    tasks:
      - { type: place_value, number: 35, ask: total, options: [33, 35, 37] }
      - { type: place_value, number: 46, ask: tens,  options: [4, 6, 8] }
      - { type: place_value, number: 58, ask: units, options: [5, 8, 9] }
      - { type: place_value, number: 29, ask: total, options: [27, 29, 31] }
    encouraging_message: "כשמפרקים מספר לעשרות ויחידות, קל יותר לספור נכון ולחלק במידה."
    quick_check:
      type: place_value
      number: 43
      ask: total
      options: [41, 43, 45]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "בחרו מספר בין 20 ל-50 וציירו אותו בעשרות ויחידות."
    footer: "בניקה סופרים מדויק — מחלקים אוכל במידה ובאיזון."

  # ── עמוד 2 · ממשיכים · חיבור/חיסור אנכי ─────────────────────────────
  mid:
    level: mid
    intro: "עכשיו נחשב כמה פירות הביאו יחד, וכמה נשארו. נחבר ונחסר בטור."
    instruction: "פתרו את התרגילים בטור. שימו לב להמרה (עשרת שלמה)."
    example:
      type: vertical_arith
      op: addition
      a: 47
      b: 25
      result: 72
      prompt: "בבוקר קטפו 47 תפוחים ובצהריים 25. כמה תפוחים יחד?"
    tasks:
      - { type: vertical_arith, op: addition,    a: 38, b: 26, result: 64, prompt: "38 בננות ועוד 26." }
      - { type: vertical_arith, op: subtraction, a: 53, b: 27, result: 26, prompt: "היו 53 ביצים, השתמשו ב-27." }
      - { type: vertical_arith, op: addition,    a: 64, b: 29, result: 93, prompt: "64 תפוזים ועוד 29." }
      - { type: vertical_arith, op: subtraction, a: 82, b: 45, result: 37, prompt: "82 גזרים, מכרו 45." }
    encouraging_message: "כשמחשבים בטור בזהירות ובמידה, מגיעים לתוצאה הנכונה."
    quick_check:
      type: vertical_arith
      op: addition
      a: 46
      b: 38
      result: 84
      prompt: "כמה יחד: 46 ועוד 38?"
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "המציאו תרגיל חיבור בטור שהתשובה שלו היא 90."
    footer: "בניקה מתקדמים יחד — מחשבים מדויק ומאזנים."

  # ── עמוד 3 · אתגר · כפל כמערך + בעיה ─────────────────────────────
  challenge:
    level: challenge
    intro: "כשמסדרים אוכל בשורות שוות, כפל עוזר לספור מהר. נסדר בשורות ועמודות ונכפול."
    instruction: "ספרו את המערך, וכתבו את תרגיל הכפל."
    example:
      type: multiply
      rows: 3
      cols: 4
      item: apple
      result: 12
      prompt: "3 שורות, בכל אחת 4 תפוחים. כמה תפוחים בסך הכול?"
    tasks:
      - { type: multiply, rows: 2, cols: 5, item: egg,    result: 10, prompt: "2 מגשים של 5 ביצים. כמה ביצים?" }
      - { type: multiply, rows: 4, cols: 3, item: carrot, result: 12, prompt: "4 שורות, בכל אחת 3 גזרים. כמה גזרים?" }
    encouraging_message: "איזון הוא לחלק שווה בשווה — יפה שסידרתם וספרתם בדיוק."
    quick_check:
      type: vertical_arith
      op: addition
      a: 156
      b: 128
      result: 284
      prompt: "בבוקר הגיעו 156 תפוחים, אחר הצהריים עוד 128. כמה יחד?"
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "המציאו בעיית כפל על אוכל (למשל: 5 צלחות × 2 תפוחים)."
    footer: "בניקה אנחנו מתקדמים — כל יום צעד קטן קדימה, ביחד."

  # ── דף מדריך/ה ─────────────────────────────

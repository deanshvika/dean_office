    adaptations:
      - "לאפשר שימוש בבלוקי עשרות ויחידות מוחשיים"
      - "להתחיל מתרגיל בלי המרה, ואז עם המרה"
      - "לכסות חלק מהמשימות ולהציג אחת בכל פעם"
      - "לאפשר מחשבון לבדיקה עצמית בסוף"

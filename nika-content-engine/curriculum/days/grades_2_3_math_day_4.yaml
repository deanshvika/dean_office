# ── מחזור 2 · יום 4 · חשבון · שכבות ב-ג ─────────────────────────────
# עולם תוכן: החי | ערך: אכפתיות
# שכבות ב-ג = ללא ניקוד. מתחילים=ערך מקום · ממשיכים=חיבור/חיסור אנכי · אתגר=כפל(מערך חיות)+בעיה
# ★ כפל משתמש בפריטי-אימוג'י (חיות) מהבנק.

day_id: grades_2_3_math_day_4
subject: math
audience: grades_2_3
niqqud: false
day_label: "יום 4 – החי: ערך מקום, חיבור/חיסור וכפל"
title: "כמה בעלי חיים בשמורה?"
core_skill: "ערך מקום, חיבור/חיסור אנכי ותחילת כפל"
subskills:
  - "עשרות ויחידות עד 100"
  - "חיבור/חיסור אנכי עם המרה"
  - "כפל כמערך (שורות × עמודות)"
theme: "החי"
leading_value: "אכפתיות"

pages:

  # ── עמוד 1 · מתחילים · ערך מקום ─────────────────────────────
  beginner:
    level: beginner
    intro: "בשמורת הטבע סופרים את בעלי החיים. כדי לדעת בדיוק כמה יש — מפרקים כל מספר לעשרות ויחידות."
    instruction: "הסתכלו על העשרות (פסים) והיחידות (ריבועים), וסמנו את המספר הנכון."
    example:
      type: place_value
      number: 24
      ask: total
      options: [22, 24, 26]
      caption: "2 עשרות ו-4 יחידות. בסך הכול 24."
    tasks:
      - { type: place_value, number: 36, ask: total, options: [34, 36, 38] }
      - { type: place_value, number: 42, ask: tens,  options: [2, 4, 6] }
      - { type: place_value, number: 58, ask: units, options: [5, 8, 9] }
      - { type: place_value, number: 27, ask: total, options: [25, 27, 29] }
    encouraging_message: "כשמפרקים מספר לעשרות ויחידות, קל יותר לספור נכון ולא לפספס אף חיה."
    quick_check:
      type: place_value
      number: 45
      ask: total
      options: [43, 45, 47]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "בחרו מספר בין 20 ל-50 וציירו אותו בעשרות ויחידות."
    footer: "בניקה דואגים לכל יצור — סופרים מדויק כדי לדעת מה כל חיה צריכה."

  # ── עמוד 2 · ממשיכים · חיבור/חיסור אנכי ─────────────────────────────
  mid:
    level: mid
    intro: "עכשיו נחשב כמה בעלי חיים יש יחד, וכמה נשארו. נחבר ונחסר בטור."
    instruction: "פתרו את התרגילים בטור. שימו לב להמרה (עשרת שלמה)."
    example:
      type: vertical_arith
      op: addition
      a: 47
      b: 25
      result: 72
      prompt: "בבריכה אחת 47 דגים ובשנייה 25. כמה דגים יש יחד?"
    tasks:
      - { type: vertical_arith, op: addition,    a: 38, b: 26, result: 64, prompt: "38 ציפורים ועוד 26 ציפורים." }
      - { type: vertical_arith, op: subtraction, a: 53, b: 27, result: 26, prompt: "היו 53 ארנבים, 27 ברחו לשדה." }
      - { type: vertical_arith, op: addition,    a: 64, b: 29, result: 93, prompt: "64 חתולים ועוד 29." }
      - { type: vertical_arith, op: subtraction, a: 82, b: 45, result: 37, prompt: "82 כלבים, 45 מצאו בית חדש." }
    encouraging_message: "כשמחשבים בטור בזהירות, דואגים שאף חיה לא תישאר בלי טיפול."
    quick_check:
      type: vertical_arith
      op: addition
      a: 46
      b: 38
      result: 84
      prompt: "כמה יחד: 46 ועוד 38?"
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "המציאו תרגיל חיבור בטור שהתשובה שלו היא 90."
    footer: "בניקה מתקדמים יחד — מחשבים מדויק ודואגים לכל יצור."

  # ── עמוד 3 · אתגר · כפל כמערך + בעיה ─────────────────────────────
  challenge:
    level: challenge
    intro: "כשיש כמה קבוצות שוות של חיות, כפל עוזר לספור מהר. נסדר בשורות ועמודות ונכפול."
    instruction: "ספרו את המערך, וכתבו את תרגיל הכפל."
    example:
      type: multiply
      rows: 3
      cols: 4
      item: cat
      result: 12
      prompt: "3 שורות, בכל אחת 4 חתולים. כמה חתולים בסך הכול?"
    tasks:
      - { type: multiply, rows: 2, cols: 5, item: fish,   result: 10, prompt: "2 שורות של 5 דגים. כמה דגים?" }
      - { type: multiply, rows: 4, cols: 3, item: rabbit, result: 12, prompt: "4 קבוצות, בכל אחת 3 ארנבים. כמה ארנבים?" }
    encouraging_message: "אכפתיות היא גם לוודא שלכל קבוצת חיות יש מספיק — יפה שחשבתם על כולן."
    quick_check:
      type: vertical_arith
      op: addition
      a: 156
      b: 128
      result: 284
      prompt: "בבוקר ספרו 156 ציפורים, אחר הצהריים עוד 128. כמה יחד?"
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "המציאו בעיית כפל על חיות (למשל: 5 כלובים × 2 ציפורים)."
    footer: "בניקה אנחנו מתקדמים — כל יום צעד קטן קדימה, ביחד."

  # ── דף מדריך/ה ─────────────────────────────
  coach_guide:
    daily_goal:
      - "ערך מקום — עשרות ויחידות עד 100"
      - "חיבור וחיסור אנכי עם המרה"
      - "כפל בסיסי כמערך (שורות × עמודות)"
      - "בעיה מילולית עם מספרים גדולים"
    leading_value:
      name: "אכפתיות"
      text: "חישוב מדויק עוזר לילד להבין שהוא אחראי שלכל בעל חיים יהיה מספיק — אוכל, מים ומקום."
    pages_overview:
      - level: beginner
        audience: "מיועד לתלמידים שצריכים בסיס מוצק:"
        points: ["פירוק מספר לעשרות ויחידות", "קריאת ייצוג ערך מקום", "בחירת המספר הנכון"]
      - level: mid
        audience: "מיועד לתלמידים שיכולים:"

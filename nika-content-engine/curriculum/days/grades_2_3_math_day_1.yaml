# ── מחזור 1 · יום 1 · חשבון · שכבות ב-ג ─────────────────────────────
# עולם תוכן: ספורט וקבוצה | ערך: אחריות קבוצתית
# דרגות קושי (ב-ג): מתחילים=ערך מקום · ממשיכים=חיבור/חיסור אנכי (המרה) · אתגר=כפל (מערכים) + בעיה
# שכבות ב-ג = ללא ניקוד (plain). מספרים גדולים מוצגים מספרית; כפל=מערך. הוולידטור מאמת כל חשבון.

day_id: grades_2_3_math_day_1
subject: math
audience: grades_2_3
niqqud: false
day_label: "יום 1 – ערך מקום, חיבור/חיסור וכפל"
title: "כמה ציוד לכל הקבוצות?"
core_skill: "ערך מקום, חיבור/חיסור אנכי ותחילת כפל"
subskills:
  - "עשרות ויחידות עד 100"
  - "חיבור/חיסור אנכי עם המרה"
  - "כפל כמערך (שורות × עמודות)"
theme: "ספורט וקבוצה"
leading_value: "אחריות קבוצתית"

pages:

  # ── עמוד 1 · מתחילים · ערך מקום ─────────────────────────────
  beginner:
    level: beginner
    intro: "המועדון סופר את הציוד לכל הקבוצות. כדי לדעת בדיוק כמה יש — מפרקים כל מספר לעשרות ויחידות."
    instruction: "הסתכלו על העשרות (פסים) והיחידות (ריבועים), וסמנו את המספר הנכון."
    example:
      type: place_value
      number: 24
      ask: total
      options: [22, 24, 26]
      caption: "2 עשרות ו-4 יחידות. בסך הכול 24."
    tasks:
      - { type: place_value, number: 36, ask: total, options: [34, 36, 38] }
      - { type: place_value, number: 42, ask: tens,  options: [2, 4, 6] }
      - { type: place_value, number: 58, ask: units, options: [5, 8, 9] }
      - { type: place_value, number: 27, ask: total, options: [25, 27, 29] }
    encouraging_message: "כשמפרקים מספר לעשרות ויחידות, קל יותר לספור נכון ולא לפספס ציוד."
    quick_check:
      type: place_value
      number: 45
      ask: total
      options: [43, 45, 47]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "בחרו מספר בין 20 ל-50 וציירו אותו בעשרות ויחידות."
    footer: "בניקה אנחנו לוקחים אחריות — סופרים מדויק כדי שלכל הקבוצות יהיה ציוד."

  # ── עמוד 2 · ממשיכים · חיבור/חיסור אנכי ─────────────────────────────
  mid:
    level: mid
    intro: "עכשיו נחשב כמה ציוד יש יחד, וכמה נשאר אחרי שמשתמשים. נחבר ונחסר בטור."
    instruction: "פתרו את התרגילים בטור. שימו לב להמרה (עשרת שלמה)."
    example:
      type: vertical_arith
      op: addition
      a: 47
      b: 25
      result: 72
      prompt: "בקבוצה אחת 47 כדורים ובשנייה 25. כמה כדורים יש יחד?"
    tasks:
      - { type: vertical_arith, op: addition,    a: 38, b: 26, result: 64, prompt: "38 חישוקים ועוד 26 חישוקים." }
      - { type: vertical_arith, op: subtraction, a: 53, b: 27, result: 26, prompt: "היו 53 קונוסים, לקחו 27." }
      - { type: vertical_arith, op: addition,    a: 64, b: 29, result: 93, prompt: "64 מדליות ועוד 29." }
      - { type: vertical_arith, op: subtraction, a: 82, b: 45, result: 37, prompt: "82 בקבוקים, חילקו 45." }
    encouraging_message: "כשמחשבים בטור בזהירות, דואגים שאף קבוצה לא תישאר בלי ציוד."
    quick_check:
      type: vertical_arith
      op: addition
      a: 46
      b: 38
      result: 84
      prompt: "כמה יחד: 46 ועוד 38?"
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "המציאו תרגיל חיבור בטור שהתשובה שלו היא 90."
    footer: "בניקה מתקדמים יחד — מחשבים מדויק ודואגים לכולם."

  # ── עמוד 3 · אתגר · כפל כמערך + בעיה ─────────────────────────────
  challenge:
    level: challenge
    intro: "כשיש כמה קבוצות שוות, כפל עוזר לספור מהר. נסדר בשורות ועמודות ונכפול."
    instruction: "ספרו את המערך, וכתבו את תרגיל הכפל."
    example:
      type: multiply
      rows: 3
      cols: 4
      item: flag
      result: 12
      prompt: "3 קבוצות, בכל אחת 4 דגלים. כמה דגלים בסך הכול?"
    tasks:
      - { type: multiply, rows: 2, cols: 5, item: ball, result: 10, prompt: "2 שורות של 5 כדורים. כמה כדורים?" }
      - { type: multiply, rows: 4, cols: 3, item: cone, result: 12, prompt: "4 קבוצות, בכל אחת 3 קונוסים. כמה קונוסים?" }
    encouraging_message: "אחריות היא גם לוודא שלכל קבוצה יש מספר שווה — יפה שחשבתם על כולם."
    quick_check:
      type: vertical_arith
      op: addition
      a: 156
      b: 128
      result: 284
      prompt: "בבוקר הגיעו 156 ילדים, אחר הצהריים עוד 128. כמה ילדים יחד?"
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "המציאו בעיית כפל על ציוד ספורט (למשל: 5 קבוצות × 2 כדורים)."
    footer: "בניקה אנחנו מתקדמים — כל יום צעד קטן קדימה, ביחד."

  # ── דף מדריך/ה ─────────────────────────────
  coach_guide:
    daily_goal:
      - "ערך מקום — עשרות ויחידות עד 100"
      - "חיבור וחיסור אנכי עם המרה"
      - "כפל בסיסי כמערך (שורות × עמודות)"
      - "בעיה מילולית עם מספרים גדולים"
    leading_value:
      name: "אחריות קבוצתית"
      text: "חישוב מדויק עוזר לילד להבין שהוא אחראי שלכל הקבוצות יהיה ציוד שווה."
    pages_overview:
      - level: beginner
        audience: "מיועד לתלמידים שצריכים בסיס מוצק:"
        points: ["פירוק מספר לעשרות ויחידות", "קריאת ייצוג ערך מקום", "בחירת המספר הנכון"]
      - level: mid
        audience: "מיועד לתלמידים שיכולים:"
        points: ["לחבר ולחסר בטור", "לבצע המרה (עשרת שלמה)", "לפתור מתוך הקשר"]
      - level: challenge

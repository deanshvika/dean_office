        points: ["להבין כפל כמערך", "לכתוב תרגיל כפל", "לפתור בעיה עם מספרים גדולים"]
    how_to_mediate:
      - "לפתוח תמיד מהפתיח ומהדוגמה"
      - "בערך מקום — לספור קודם עשרות ואז יחידות"
      - "בטור — ליישר ספרות ולהזכיר את ההמרה"
      - "בכפל — לספור שורה אחת ואז לכפול במספר השורות"
      - "לחבר את המספר לערך: 'חישבנו כדי שלכל קבוצה יהיה'"
    adaptations:

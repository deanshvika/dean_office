# ── מחזור 1 · יום 3 · אנגלית · שכבות ב-ג ─────────────────────────────
# עולם תוכן: ספורט וקבוצה | ערך: הכלה
# ★ בידול-רמה מא' (פידבק חי): כל שלב שונה מהמקביל בשכבה א'.
#   ב-ג: מתחילים=picture→word (4 אפשרויות, אוצר מורחב) · ממשיכים=spell_choice (בחירת איות) · אתגר=complete sentence.
#   (א' לעומת זאת: word→picture · picture→word(3) · picture→word(4).)
# שכבות ב-ג = ללא ניקוד (הוראות עברית plain; אנגלית plain). אוצר מורחב: ball/bag/bottle/cone/cup/net/hat/medal/flag.

day_id: grades_2_3_english_day_3
subject: english
audience: grades_2_3
niqqud: false
day_label: "יום 3 – Words and Spelling"
title: "What does the team bring?"
core_skill: "אוצר מורחב, זיהוי מילה, איות נכון והשלמת משפט"
subskills:
  - "זיהוי מילה לפי תמונה (אוצר מורחב, 4 אפשרויות)"
  - "בחירת האיות הנכון של מילה"
  - "השלמת משפט מבנק מילים"
theme: "ספורט וקבוצה"
leading_value: "הכלה"

pages:

  # ── עמוד 1 · מתחילים · picture → word (4 אפשרויות, אוצר מורחב) ─────────
  beginner:
    level: beginner
    intro: "בשכבות ב-ג מרחיבים את אוצר המילים באנגלית. הסתכלו על התמונה ובחרו את המילה הנכונה מבין ארבע."
    instruction: "Look at the picture and choose the correct word (4 choices)."
    example:
      type: pic_word
      item: ball
      distractors: [bag, cup, net]
      caption: "Choose the word: ball"
    tasks:
      - { type: pic_word, item: bottle, distractors: [ball, cup, hat] }
      - { type: pic_word, item: net,    distractors: [cone, bag, medal] }
      - { type: pic_word, item: cup,    distractors: [bottle, ball, flag] }
      - { type: pic_word, item: cone,   distractors: [net, bag, hat] }
    encouraging_message: "In NIKA everyone plays together. Everyone can learn new words."
    quick_check:
      type: pic_word
      item: bag
      distractors: [ball, bottle, medal]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "Write two English words for sports equipment you know."
    footer: "בניקה מתקדמים יחד — לומדים, מנסים ועוזרים לקבוצה."

  # ── עמוד 2 · ממשיכים · spell_choice (בחירת האיות הנכון) ─────────────
  mid:
    level: mid
    intro: "עכשיו נקרא בדיוק: לכל תמונה נבחר את המילה שכתובה נכון באנגלית."
    instruction: "Look at the picture. Choose the word that is spelled correctly."
    example:
      type: spell_choice
      item: ball
      options: [ball, bal, balll]
      answer: ball
      caption: "The correct spelling is: ball"
    tasks:
      - { type: spell_choice, item: bottle, options: [bottle, botle, bottel], answer: bottle }
      - { type: spell_choice, item: cone,   options: [cone, coan, conne],    answer: cone }
      - { type: spell_choice, item: net,    options: [net, neet, nnet],      answer: net }
      - { type: spell_choice, item: cup,    options: [cup, cupp, cuup],      answer: cup }
    encouraging_message: "When we practice together, everyone improves — step by step."
    quick_check:
      type: spell_choice
      item: bag
      options: [bag, bagg, baag]
      answer: bag
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "Point to a picture and say the word in English to a friend."
    footer: "בניקה מתקדמים יחד — מנסים, מתמידים ועוזרים לקבוצה."

  # ── עמוד 3 · אתגר · complete sentence ─────────────────────────────
  challenge:
    level: challenge
    intro: "עכשיו נקרא משפט באנגלית ונשלים אותו מתוך בנק מילים."
    instruction: "Read the sentence and choose the correct word from the word bank."
    example:
      type: complete_sentence
      sentence: "The team brings a ___ to the game."
      word_bank: [ball, bag, net]
      answer: ball
      item: ball
      caption: "The word that fits is: ball"
    tasks:
      - { type: complete_sentence, sentence: "We keep the water in a ___.",   word_bank: [bottle, cup, bag], answer: bottle, item: bottle }
      - { type: complete_sentence, sentence: "The players run around the ___.", word_bank: [cone, net, ball], answer: cone, item: cone }
    encouraging_message: "Great teamwork! When everyone joins in, we all find the right word."
    quick_check:
      type: complete_sentence
      sentence: "I carry my things in a ___."
      word_bank: [bag, ball, cup]
      answer: bag
      item: bag
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "Write your own short sentence in English about the team."
    footer: "בניקה אנחנו מתקדמים — כל יום צעד קטן קדימה, ביחד."

  # ── דף מדריך/ה ─────────────────────────────
  coach_guide:
    daily_goal:
      - "זיהוי מילה לפי תמונה (אוצר מורחב, 4 אפשרויות)"
      - "בחירת האיות הנכון של מילה"
      - "השלמת משפט קצר מבנק מילים"
      - "קריאה ואיות מדויקים באנגלית"
    leading_value:
      name: "הכלה"
      text: "כל תלמיד יכול להשתתף ולהצליח באנגלית ברמתו — everyone plays together."
    pages_overview:
      - level: beginner
        audience: "מיועד לתלמידים שיכולים:"
        points: ["לזהות מילה לפי תמונה", "לבחור מבין 4 אפשרויות", "אוצר מילים מורחב"]
      - level: mid
        audience: "מיועד לתלמידים שיכולים:"
        points: ["לקרוא מילה בדיוק", "לבחור את האיות הנכון", "להבחין בין איות נכון לשגוי"]
      - level: challenge
        audience: "מיועד לתלמידים שיכולים:"
        points: ["לקרוא משפט קצר באנגלית", "לבחור מילה מבנק מילים", "להשלים משפט לפי ההקשר"]
    how_to_mediate:
      - "לפתוח תמיד מהפתיח ומהדוגמה"
      - "לומר את המילה באנגלית בקול ולבקש לחזור"
      - "באיות — להשוות אות-אות בין האפשרויות ולמצוא את השגיאה"
      - "במשפט — לקרוא יחד ולבדוק איזו מילה הגיונית"
      - "להדגיש שכל תלמיד יכול להשתתף (הכלה)"
    adaptations:
      - "להציג משימה אחת בכל פעם"
      - "לחזור על המילה כמה פעמים"
      - "לחבר בין המילה לחפץ אמיתי"
      - "לתת בחירה בין שתי תשובות במקום שלוש"
      - "לאפשר תשובה בהצבעה"
    fast_finishers:
      - "לעבור ל'אתגר'"
      - "לתת את הבונוס"
      - "לבקש לומר משפט קצר באנגלית"
      - "לבקש למצוא חפץ נוסף ולומר את שמו"
    coach_message:
      lead: "הדגש הוא לא על 'מבטא מושלם', אלא על:"
      values: ["ניסיון", "הכלה", "חזרתיות", "ביטחון", "תחושת הצלחה"]
    phrases:
      - "Great try."
      - "Everyone can play."
      - "You read it well."
      - "You helped your friend."
      - "You kept going."
    footer_legend: ["הכלה", "ניסיון", "חזרתיות", "ביטחון", "תחושת הצלחה"]

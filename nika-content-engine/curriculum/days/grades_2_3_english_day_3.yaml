# ── מחזור 1 · יום 3 · אנגלית · שכבות ב-ג ─────────────────────────────
# עולם תוכן: ספורט וקבוצה | ערך: הכלה
# דרגות קושי (ב-ג): מתחילים=word→picture · ממשיכים=picture→word · אתגר=complete sentence
#   ★ complete_sentence (קריאת משפט) שייך לכאן — קריאת משפט באנגלית = מיומנות ב-ג.
# שכבות ב-ג = ללא ניקוד (הוראות עברית plain; אנגלית plain). בידול: אנגלית על סט B (ball/bag/bottle/cone/cup/net).

day_id: grades_2_3_english_day_3
subject: english
audience: grades_2_3
niqqud: false
day_label: "יום 3 – Words and Sentences"
title: "What does the team bring?"
core_skill: "אוצר מורחב, זיהוי מילה והשלמת משפט באנגלית"
subskills:
  - "זיהוי מילה↔תמונה (אוצר מורחב)"
  - "בחירת המילה הנכונה לפי תמונה"
  - "השלמת משפט מבנק מילים"
theme: "ספורט וקבוצה"
leading_value: "הכלה"

pages:

  # ── עמוד 1 · מתחילים · word → picture ─────────────────────────────
  beginner:
    level: beginner
    intro: "בשכבות ב-ג ממשיכים להרחיב את אוצר המילים באנגלית. קראו כל מילה והתאימו לתמונה."
    instruction: "Read the word and circle the matching picture."
    example:
      type: word_picture
      item: ball
      word: "ball"
      word_label: "Word:"
      distractors: [bag, cup]
      caption: "Circle: ball"
    tasks:
      - { type: word_picture, item: bag,    word: "bag",    word_label: "Word:", distractors: [bottle, ball] }
      - { type: word_picture, item: cone,   word: "cone",   word_label: "Word:", distractors: [cup, net] }
      - { type: word_picture, item: net,    word: "net",    word_label: "Word:", distractors: [ball, bottle] }
      - { type: word_picture, item: cup,    word: "cup",    word_label: "Word:", distractors: [bag, cone] }
    encouraging_message: "In NIKA everyone plays together. Everyone can learn new words."
    quick_check:
      type: word_picture
      item: bottle
      word: "bottle"
      word_label: "Word:"
      distractors: [cup, bag]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "Write two English words for sports equipment you know."
    footer: "בניקה מתקדמים יחד — לומדים, מנסים ועוזרים לקבוצה."

  # ── עמוד 2 · ממשיכים · picture → word ─────────────────────────────
  mid:
    level: mid
    intro: "עכשיו נסתכל על התמונה ונבחר את המילה הנכונה באנגלית."
    instruction: "Look at the picture and choose the correct word."
    example:
      type: pic_word
      item: ball
      distractors: [bag, net]
      caption: "Choose the word: ball"
    tasks:
      - { type: pic_word, item: bottle, distractors: [ball, cup] }
      - { type: pic_word, item: net,    distractors: [cone, bag] }
      - { type: pic_word, item: cup,    distractors: [bottle, ball] }
      - { type: pic_word, item: cone,   distractors: [net, bag] }
    encouraging_message: "When we practice together, everyone improves — step by step."
    quick_check:
      type: pic_word
      item: bag
      distractors: [ball, bottle]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "Point to a picture and say the word in English to a friend."
    footer: "בניקה מתקדמים יחד — מנסים, מתמידים ועוזרים לקבוצה."

  # ── עמוד 3 · אתגר · complete sentence ─────────────────────────────
  challenge:
    level: challenge
    intro: "עכשיו נקרא משפט באנגלית ונשלים אותו מתוך בנק מילים."
    instruction: "Read the sentence and choose the correct word from the word bank."
    example:
      type: complete_sentence
      sentence: "The team brings a ___ to the game."
      word_bank: [ball, bag, net]
      answer: ball
      item: ball
      caption: "The word that fits is: ball"
    tasks:
      - { type: complete_sentence, sentence: "We keep the water in a ___.",   word_bank: [bottle, cup, bag], answer: bottle, item: bottle }
      - { type: complete_sentence, sentence: "The players run around the ___.", word_bank: [cone, net, ball], answer: cone, item: cone }
    encouraging_message: "Great teamwork! When everyone joins in, we all find the right word."
    quick_check:
      type: complete_sentence
      sentence: "I carry my things in a ___."
      word_bank: [bag, ball, cup]
      answer: bag
      item: bag
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "Write your own short sentence in English about the team."
    footer: "בניקה אנחנו מתקדמים — כל יום צעד קטן קדימה, ביחד."

  # ── דף מדריך/ה ─────────────────────────────
  coach_guide:
    daily_goal:
      - "זיהוי מילה↔תמונה (אוצר מורחב)"
      - "בחירת המילה הנכונה לפי תמונה"
      - "השלמת משפט קצר מבנק מילים"
      - "קריאה בסיסית של משפט באנגלית"
    leading_value:
      name: "הכלה"
      text: "כל תלמיד יכול להשתתף ולהצליח באנגלית ברמתו — everyone plays together."
    pages_overview:
      - level: beginner
        audience: "מיועד לתלמידים שצריכים חיזוק:"
        points: ["קריאת מילה באנגלית", "התאמה לתמונה", "בחירה בין 3 אפשרויות"]
      - level: mid
        audience: "מיועד לתלמידים שיכולים:"
        points: ["לזהות מילה לפי תמונה", "לקרוא מילה בביטחון", "להבחין בין מילים דומות"]
      - level: challenge
        audience: "מיועד לתלמידים שיכולים:"
        points: ["לקרוא משפט קצר באנגלית", "לבחור מילה מבנק מילים", "להשלים משפט לפי ההקשר"]
    how_to_mediate:
      - "לפתוח תמיד מהפתיח ומהדוגמה"
      - "לומר את המילה באנגלית בקול ולבקש לחזור"
      - "במשפט — לקרוא יחד ולבדוק איזו מילה הגיונית"
      - "להדגיש שכל תלמיד יכול להשתתף (הכלה)"
      - "להקטין מספר אפשרויות אם צריך"
    adaptations:
      - "להציג משימה אחת בכל פעם"
      - "לחזור על המילה כמה פעמים"
      - "לחבר בין המילה לחפץ אמיתי"
      - "לתת בחירה בין שתי תשובות במקום שלוש"
      - "לאפשר תשובה בהצבעה"
    fast_finishers:
      - "לעבור ל'אתגר'"
      - "לתת את הבונוס"
      - "לבקש לומר משפט קצר באנגלית"
      - "לבקש למצוא חפץ נוסף ולומר את שמו"
    coach_message:
      lead: "הדגש הוא לא על 'מבטא מושלם', אלא על:"
      values: ["ניסיון", "הכלה", "חזרתיות", "ביטחון", "תחושת הצלחה"]
    phrases:
      - "Great try."
      - "Everyone can play."
      - "You read it well."
      - "You helped your friend."
      - "You kept going."
    footer_legend: ["הכלה", "ניסיון", "חזרתיות", "ביטחון", "תחושת הצלחה"]

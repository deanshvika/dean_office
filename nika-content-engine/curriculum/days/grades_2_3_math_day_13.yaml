# ── מחזור 5 · יום 13 · חשבון · שכבות ב-ג ─────────────────────────────
# עולם תוכן: בית הספר והחברים | ערך: סדר וארגון
# שכבות ב-ג = ללא ניקוד. מתחילים=ערך מקום · ממשיכים=חיבור/חיסור אנכי · אתגר=כפל(מערך)+בעיה
# ★ כפל משתמש בפריטי-אימוג'י (כלי כיתה) מהבנק.

day_id: grades_2_3_math_day_13
subject: math
audience: grades_2_3
niqqud: false
day_label: "יום 13 – בית הספר: ערך מקום, חיבור/חיסור וכפל"
title: "מסדרים וסופרים בכיתה"
core_skill: "ערך מקום, חיבור/חיסור אנכי ותחילת כפל"
subskills:
  - "עשרות ויחידות עד 100"
  - "חיבור/חיסור אנכי עם המרה"
  - "כפל כמערך (שורות × עמודות)"
theme: "בית הספר והחברים"
leading_value: "סדר וארגון"

pages:

  # ── עמוד 1 · מתחילים · ערך מקום ─────────────────────────────
  beginner:
    level: beginner
    intro: "במחסן בית הספר סופרים כמה ספרים ומחברות הגיעו. כדי לסדר — מפרקים כל מספר לעשרות ויחידות."
    instruction: "הסתכלו על העשרות (פסים) והיחידות (ריבועים), וסמנו את המספר הנכון."
    example:
      type: place_value
      number: 24
      ask: total
      options: [22, 24, 26]
      caption: "2 עשרות ו-4 יחידות. בסך הכול 24."
    tasks:
      - { type: place_value, number: 37, ask: total, options: [35, 37, 39] }
      - { type: place_value, number: 45, ask: tens,  options: [4, 5, 6] }
      - { type: place_value, number: 56, ask: units, options: [5, 6, 8] }
      - { type: place_value, number: 28, ask: total, options: [26, 28, 30] }
    encouraging_message: "כשמפרקים מספר לעשרות ויחידות, קל יותר לספור ולסדר בלי להתבלבל."
    quick_check:
      type: place_value
      number: 42
      ask: total
      options: [40, 42, 44]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "בחרו מספר בין 20 ל-50 וציירו אותו בעשרות ויחידות."
    footer: "בניקה סופרים מדויק — כיתה מסודרת ומאורגנת."

  # ── עמוד 2 · ממשיכים · חיבור/חיסור אנכי ─────────────────────────────
  mid:
    level: mid
    intro: "עכשיו נחשב כמה ספרים ומחברות יש יחד, וכמה נשארו. נחבר ונחסר בטור."
    instruction: "פתרו את התרגילים בטור. שימו לב להמרה (עשרת שלמה)."
    example:
      type: vertical_arith
      op: addition
      a: 47
      b: 25
      result: 72
      prompt: "בכיתה א' 47 ספרים, בכיתה ב' 25. כמה ספרים יחד?"
    tasks:
      - { type: vertical_arith, op: addition,    a: 38, b: 26, result: 64, prompt: "38 מחברות ועוד 26." }
      - { type: vertical_arith, op: subtraction, a: 53, b: 27, result: 26, prompt: "היו 53 עפרונות, חילקו 27." }
      - { type: vertical_arith, op: addition,    a: 64, b: 29, result: 93, prompt: "64 ספרים ועוד 29." }
      - { type: vertical_arith, op: subtraction, a: 82, b: 45, result: 37, prompt: "82 דפים, השתמשו ב-45." }
    encouraging_message: "כשמחשבים בטור בזהירות ובסדר, מגיעים לתוצאה הנכונה."
    quick_check:
      type: vertical_arith
      op: addition
      a: 46
      b: 38
      result: 84
      prompt: "כמה יחד: 46 ועוד 38?"
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "המציאו תרגיל חיבור בטור שהתשובה שלו היא 90."
    footer: "בניקה מתקדמים יחד — מחשבים מדויק ומסדרים."

  # ── עמוד 3 · אתגר · כפל כמערך + בעיה ─────────────────────────────
  challenge:
    level: challenge
    intro: "כשמסדרים ספרים בשורות שוות, כפל עוזר לספור מהר. נסדר בשורות ועמודות ונכפול."
    instruction: "ספרו את המערך, וכתבו את תרגיל הכפל."
    example:
      type: multiply
      rows: 3
      cols: 4
      item: book
      result: 12
      prompt: "3 מדפים, בכל אחד 4 ספרים. כמה ספרים בסך הכול?"
    tasks:
      - { type: multiply, rows: 2, cols: 5, item: notebook, result: 10, prompt: "2 שורות של 5 מחברות. כמה מחברות?" }
      - { type: multiply, rows: 4, cols: 3, item: pencil,   result: 12, prompt: "4 קופסאות, בכל אחת 3 עפרונות. כמה עפרונות?" }
    encouraging_message: "סדר הוא לארגן הכול במקום — יפה שסידרתם וספרתם בדיוק."
    quick_check:
      type: vertical_arith
      op: addition
      a: 156
      b: 128
      result: 284
      prompt: "בבוקר הגיעו 156 ספרים, אחר הצהריים עוד 128. כמה יחד?"
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "המציאו בעיית כפל על כלי כיתה (למשל: 5 מדפים × 2 ספרים)."
    footer: "בניקה אנחנו מתקדמים — כל יום צעד קטן קדימה, ביחד."

  # ── דף מדריך/ה ─────────────────────────────

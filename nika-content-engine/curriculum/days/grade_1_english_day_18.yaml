# ── מחזור 6 · יום 18 · אנגלית · שכבה א' ─────────────────────────────
# עולם תוכן: טבע וסביבה | ערך: הערכת הטבע
# בידול מ"שפה" (#17): אנגלית על סט sun/star/moon/rain/tree
#   (עברית עובדת על פרח/עלה/ענן/קשת/יער). כמעט בלי חפיפה → לא תרגום.
# מדיניות: הוראות/פתיח עברית מנוקדות; אנגלית plain. פריטי-אימוג'י מהבנק.

day_id: grade_1_english_day_18
subject: english
audience: grade_1
niqqud: true
day_label: "יוֹם 18 – Nature: Words and Pictures"
title: "I love nature"
core_skill: "אוצר מילים באנגלית: זיהוי מילה↔תמונה (טבע)"
subskills:
  - "התאמת מילה באנגלית לתמונה מהטבע"
  - "בחירת המילה הנכונה לפי תמונה"
  - "זיהוי מילה מבין ארבע אפשרויות"
theme: "טבע וסביבה"
leading_value: "הערכת הטבע"

pages:

  # ── עמוד 1 · מתחילים · word → picture ─────────────────────────────
  beginner:
    level: beginner
    intro: "לַטֶּבַע יֵשׁ שֵׁמוֹת גַּם בְּאַנְגְּלִית. בּוֹאוּ נַכִּיר אוֹתָם וְנֹאהַב אֶת הַטֶּבַע."
    instruction: "Read or listen to the word. Circle the matching picture."
    example:
      type: word_picture
      item: sun
      word: "sun"
      word_label: "Word:"
      distractors: [moon, tree]
      caption: "Circle: sun"
    tasks:
      - { type: word_picture, item: star, word: "star", word_label: "Word:", distractors: [rain, sun] }
      - { type: word_picture, item: moon, word: "moon", word_label: "Word:", distractors: [tree, star] }
      - { type: word_picture, item: rain, word: "rain", word_label: "Word:", distractors: [sun, moon] }
      - { type: word_picture, item: tree, word: "tree", word_label: "Word:", distractors: [star, rain] }
    encouraging_message: "In NIKA we love nature. We learn its names together."
    quick_check:
      type: word_picture
      item: moon
      word: "moon"
      word_label: "Word:"
      distractors: [sun, tree]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "Point to one thing in nature and say its name in English."
    footer: "בְּנִיקָה מִתְקַדְּמִים יַחַד — לוֹמְדִים, מְנַסִּים וְאוֹהֲבִים אֶת הַטֶּבַע."

  # ── עמוד 2 · ממשיכים · picture → word ─────────────────────────────
  mid:
    level: mid
    intro: "עַכְשָׁיו נִסְתַּכֵּל עַל הַתְּמוּנָה וְנִבְחַר אֶת הַמִּלָּה הַנְּכוֹנָה בְּאַנְגְּלִית."
    instruction: "Look at the picture and choose the correct word."
    example:
      type: pic_word
      item: sun
      distractors: [moon, star]
      caption: "Choose the word for the picture: sun"
    tasks:
      - { type: pic_word, item: star, distractors: [tree, sun] }
      - { type: pic_word, item: moon, distractors: [rain, star] }
      - { type: pic_word, item: rain, distractors: [sun, tree] }
      - { type: pic_word, item: tree, distractors: [moon, rain] }
    encouraging_message: "When we look closely at nature, we learn to love it."
    quick_check:
      type: pic_word
      item: rain
      distractors: [sun, moon]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "Point to a picture. Can your friend say the word in English?"
    footer: "בְּנִיקָה מִתְקַדְּמִים יַחַד — מְנַסִּים, אוֹהֲבִים וּמַצְלִיחִים."

  # ── עמוד 3 · אתגר · picture → word עם 4 אפשרויות ──────────────────
  challenge:
    level: challenge
    intro: "עַכְשָׁיו נִבְחַר אֶת הַמִּלָּה הַנְּכוֹנָה בְּאַנְגְּלִית מִבֵּין אַרְבַּע מִלִּים."
    instruction: "Look at the picture and choose the correct word (4 choices)."
    example:
      type: pic_word
      item: sun
      distractors: [moon, star, rain]
      caption: "Choose the word: sun"
    tasks:
      - { type: pic_word, item: moon, distractors: [sun, star, tree] }
      - { type: pic_word, item: tree, distractors: [rain, moon, star] }
    encouraging_message: "Great! Everyone can learn the nature words."
    quick_check:
      type: pic_word
      item: star
      distractors: [sun, moon, rain]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "Name one more thing in nature in English you know."
    footer: "בְּנִיקָה אֲנַחְנוּ מִתְקַדְּמִים — כָּל יוֹם צַעַד קָטָן קָדִימָה."

  # ── דף מדריך/ה (ללא ניקוד) ─────────────────────────────
  coach_guide:
    daily_goal:
      - "זיהוי מילה באנגלית לפי תמונה מהטבע"
      - "בחירת המילה הנכונה לפי תמונה"
      - "זיהוי מילה מבין ארבע אפשרויות"
      - "חשיפה מוקדמת ובטוחה לאנגלית (שמיעה+זיהוי)"
    leading_value:
      name: "הערכת הטבע"
      text: "הכרת הטבע באנגלית מחזקת הערכה ואהבה — לומדים להתפעל מהשמש, הכוכבים והעצים ולשמור עליהם."
    pages_overview:
      - level: beginner
        audience: "מיועד לילדים שצריכים כניסה פשוטה:"
        points: ["שמיעת מילה באנגלית", "זיהוי פריט הטבע המתאים", "בחירה בין 3 אפשרויות"]
      - level: mid
        audience: "מיועד לילדים שיכולים:"
        points: ["להסתכל על תמונה ולבחור מילה", "לזהות שם פריט טבע באנגלית", "להבחין בין מילים דומות"]
      - level: challenge
        audience: "מיועד לילדים שיכולים:"
        points: ["לזהות מילה מבין ארבע אפשרויות", "להבחין בין שמות פריטי טבע", "לשמוע/לומר מילה בביטחון"]
    how_to_mediate:
      - "לפתוח תמיד מהפתיח ומהדוגמה"
      - "לומר את שם פריט הטבע באנגלית בקול ולבקש לחזור"
      - "באתגר — להצביע על הפריט ולומר את ארבע המילים לפני הבחירה"
      - "לחבר לערך: 'מה יפה בפריט הזה בטבע?'"
      - "להקטין מספר אפשרויות אם צריך"
    adaptations:
      - "להציג משימה אחת בכל פעם"
      - "לחזור על המילה כמה פעמים"
      - "לחבר בין המילה לפריט אמיתי בטבע (להראות/להצביע)"
      - "לתת בחירה בין שתי תשובות במקום שלוש"
      - "לאפשר לענות בהצבעה"
    fast_finishers:
      - "לעבור ל'אתגר'"
      - "לתת את הבונוס"
      - "לבקש לומר שם פריט טבע נוסף באנגלית"
      - "לבקש להצביע על פריט בטבע ולומר את שמו"
    coach_message:
      lead: "הדגש הוא לא על 'מבטא מושלם', אלא על:"
      values: ["הערכת הטבע", "ניסיון", "חזרתיות", "ביטחון", "תחושת הצלחה"]
    phrases:
      - "Great try."
      - "You love nature."
      - "You found it in nature."
      - "You helped your friend."
      - "You kept going."
    footer_legend: ["הערכת הטבע", "ניסיון", "חזרתיות", "ביטחון", "תחושת הצלחה"]

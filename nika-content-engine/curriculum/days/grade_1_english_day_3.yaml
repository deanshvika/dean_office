# ── מחזור 1 · יום 3 · אנגלית · שכבה א' ─────────────────────────────
# עולם תוכן: ספורט וקבוצה | ערך: הכלה (everyone plays together)
# דרגות קושי: מתחילים=אותיות אנגליות (זיהוי אות + אות פותחת) · ממשיכים=picture→word · אתגר=picture→word עם 4 אפשרויות
#   ★ אותיות בכל המקצועות (החלטת דין — גובר על המלצת oral-first): מתחילים נכנס מהאות. זיהוי אות בלבד (לא פונטיקה/תנועות).
# ★ עוגן/גשר עברי: גשר-צליל בעל-פה במדריך ("B כמו בּ"); עוגן-מילה עברי בדוגמאות mid/challenge. אין תעתיק על הדף.
# בידול מ"שפה" (#7): אנגלית עובדת על אוצר "סט B" — ball/bag/bottle/cone/cup/net
#   (עברית עובדת על אובייקטים אחרים — דגל/חישוק/נעליים/מדליה/משרוקית/כובע). כמעט בלי חפיפה → לא תרגום.
# מדיניות: הוראות/פתיח עברית מנוקדות; אנגלית plain.

day_id: grade_1_english_day_3
subject: english
audience: grade_1
niqqud: true
day_label: "יוֹם 3 – Letters and Words"
title: "What does the team bring?"
core_skill: "אותיות אנגליות ואוצר מילים: זיהוי אות, אות פותחת, וזיהוי מילה↔תמונה"
subskills:
  - "זיהוי אות אנגלית ואיזו אות פותחת מילה"
  - "בחירת המילה הנכונה לפי תמונה"
  - "זיהוי מילה מבין ארבע אפשרויות"
theme: "ספורט וקבוצה"
leading_value: "הכלה"

pages:

  # ── עמוד 1 · מתחילים · אותיות אנגליות (זיהוי אות + אות פותחת) ──────
  # ★ נכנסים מהאות (החלטת דין: אותיות בכל המקצועות). זיהוי אות אנגלית + איזו אות פותחת את המילה.
  #   האות הפותחת נגזרת מ-items[].en (openingLetterEn) — אפס טעות. גשר-צליל עברי בעל-פה במדריך.
  #   זהירות: זיהוי אות בלבד (לא פונטיקה/תנועות מסובכות). מסיחים מובחנים.
  beginner:
    level: beginner
    intro: "בְּאַנְגְּלִית מַתְחִילִים מֵהָאוֹת. בּוֹאוּ נַכִּיר אֶת הָאוֹתִיּוֹת בְּאַנְגְּלִית."
    instruction: "Look and choose the correct English letter."
    example:
      type: letter_id
      letter: "B"
      options: ["B", "M", "S"]
      caption: "Circle the letter B."
    tasks:
      - { type: letter_id,      letter: "C", options: ["C", "T", "M"] }
      - { type: opening_letter, item: ball, options: ["B", "C", "N"] }
      - { type: opening_letter, item: cone, options: ["C", "B", "N"] }
      - { type: opening_letter, item: net,  options: ["N", "B", "C"] }
    encouraging_message: "Great! Everyone can learn the English letters — one at a time."
    quick_check:
      type: opening_letter
      item: bag
      options: ["B", "N", "C"]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "Say one English letter you know, and find a word that starts with it."
    footer: "בְּנִיקָה מִתְקַדְּמִים יַחַד — אוֹת אַחַר אוֹת, מִלָּה אַחַר מִלָּה."

  # ── עמוד 2 · ממשיכים · picture → word ─────────────────────────────
  mid:
    level: mid
    intro: "עַכְשָׁיו נִסְתַּכֵּל עַל הַתְּמוּנָה וְנִבְחַר אֶת הַמִּלָּה הַנְּכוֹנָה בְּאַנְגְּלִית."
    instruction: "Look at the picture and choose the correct word."
    example:
      type: pic_word
      item: ball
      hebrew_anchor: true      # עוגן עברי בדוגמה בלבד (נגזר מהבנק: כַּדּוּר)
      distractors: [bag, net]
      caption: "Choose the word for the picture: ball"
    tasks:
      - { type: pic_word, item: bottle, distractors: [ball, cup] }
      - { type: pic_word, item: net,    distractors: [cone, bag] }
      - { type: pic_word, item: cup,    distractors: [bottle, ball] }
      - { type: pic_word, item: cone,   distractors: [net, bag] }
    encouraging_message: "When we practice together, everyone improves — step by step."
    quick_check:
      type: pic_word
      item: bag
      distractors: [ball, bottle]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "Partner challenge: Point to a picture. Can your friend say the word in English?"
    footer: "בְּנִיקָה מִתְקַדְּמִים יַחַד — מְנַסִּים, מַתְמִידִים וְעוֹזְרִים לַקְּבוּצָה."

  # ── עמוד 3 · אתגר · picture → word עם 4 אפשרויות (זיהוי מורחב, מתאים-גיל) ──
  challenge:
    level: challenge
    intro: "עַכְשָׁיו נִבְחַר אֶת הַמִּלָּה הַנְּכוֹנָה בְּאַנְגְּלִית מִבֵּין אַרְבַּע מִלִּים."
    instruction: "Look at the picture and choose the correct word (4 choices)."
    example:
      type: pic_word
      item: ball
      hebrew_anchor: true      # עוגן עברי בדוגמה בלבד (נגזר מהבנק: כַּדּוּר)
      distractors: [bag, cup, net]
      caption: "Choose the word: ball"
    tasks:
      - { type: pic_word, item: bottle, distractors: [ball, cup, bag] }
      - { type: pic_word, item: net,    distractors: [cone, bag, ball] }
    encouraging_message: "Great teamwork! Everyone can find the right word."
    quick_check:
      type: pic_word
      item: cup
      distractors: [ball, bottle, bag]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "Say a word in English for something your team uses. Can a friend point to it?"
    footer: "בְּנִיקָה אֲנַחְנוּ מִתְקַדְּמִים — כָּל יוֹם צַעַד קָטָן קָדִימָה."

  # ── דף מדריך/ה (ללא ניקוד) ─────────────────────────────
  coach_guide:
    daily_goal:
      - "זיהוי אות אנגלית ואיזו אות פותחת מילה (נקודת-כניסה)"
      - "בחירת המילה הנכונה לפי תמונה"
      - "זיהוי מילה מבין ארבע אפשרויות"
      - "חשיפה מוקדמת ובטוחה לאנגלית (אות ומילה, בלי קריאת משפט)"
    leading_value:
      name: "הכלה"
      text: "כל ילד יכול להשתתף ולהצליח באנגלית ברמתו — everyone plays together."
    pages_overview:
      - level: beginner
        audience: "מיועד לילדים שצריכים כניסה פשוטה ובטוחה:"
        points: ["זיהוי אות אנגלית", "איזו אות פותחת מילה", "בחירה בין 3 אותיות"]
      - level: mid
        audience: "מיועד לילדים שיכולים:"
        points: ["להסתכל על תמונה ולבחור מילה", "לקרוא מילה באנגלית", "להבחין בין מילים דומות"]
      - level: challenge
        audience: "מיועד לילדים שיכולים:"
        points: ["לזהות מילה מבין ארבע אפשרויות", "להבחין בין מילים דומות", "לקרוא/לשמוע מילה בביטחון"]
    how_to_mediate:
      - "לפתוח תמיד מהפתיח ומהדוגמה"
      - "העוגן העברי בדוגמה נותן ודאות — אחר כך המשימות באנגלית בלבד"
      - "גשר-צליל בעל-פה: 'B כמו בּ', 'M כמו מ' — רק לצלילים שמתאימים (לא th/w/r)"
      - "לומר את המילה באנגלית בקול ברור ולבקש לחזור"
      - "להדגיש שכל ילד יכול להשתתף (הכלה)"
    adaptations:
      - "להציג משימה אחת בכל פעם"
      - "לחזור על המילה כמה פעמים"
      - "לחבר בין המילה לתנועה או לחפץ אמיתי"
      - "לתת בחירה בין שתי תשובות במקום שלוש"
      - "לאפשר לענות בהצבעה"
    fast_finishers:
      - "לעבור ל'אתגר'"
      - "לתת את הבונוס"
      - "לבקש לומר מילה לחבר"
      - "לבקש למצוא עוד חפץ בכיתה ולומר את שמו באנגלית"
    coach_message:
      lead: "הדגש הוא לא על 'מבטא מושלם', אלא על:"
      values: ["ניסיון", "הכלה", "חזרתיות", "ביטחון", "תחושת הצלחה"]
    phrases:
      - "Great try."
      - "Everyone can play."
      - "You checked again. Excellent."
      - "You helped your friend."
      - "You kept going."
    footer_legend: ["הכלה", "ניסיון", "חזרתיות", "ביטחון", "תחושת הצלחה"]

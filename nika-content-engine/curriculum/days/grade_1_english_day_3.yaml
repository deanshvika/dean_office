# ── יום: אנגלית · שכבה א' · יום 3 (Word and Picture) ─────────────
# מדיניות: english + grade_1 => תוויות עברית מנוקדות; מילים ותוכן באנגלית (plain).
# הוולידטור אוכף ניקוד רק על מילים עבריות; אנגלית (לטינית) עוברת חופשי.

day_id: grade_1_english_day_3
subject: english
audience: grade_1
niqqud: true
day_label: "יוֹם 3 – Word and Picture"
title: "What do we bring?"
core_skill: "זיהוי מילה באנגלית והתאמתה לתמונה"
subskills:
  - "קריאה ראשונית של מילים באנגלית"
theme: "ציוד לקבוצה"
leading_value: "מוכנות ואחריות אישית"

pages:

  # ── עמוד 1 · מתחילים ─────────────────────────────
  beginner:
    level: beginner
    intro: "הַקְּבוּצָה מִתְכּוֹנֶנֶת לִפְעִילוּת. בּוֹאוּ נִבְדֹּק אֵילוּ מִלִּים בְּאַנְגְּלִית אֲנַחְנוּ כְּבָר מַכִּירִים."
    instruction: "Read or listen to the word. Circle the matching picture."
    example:
      type: word_picture
      item: bottle
      word: "water"
      word_label: "Word:"
      distractors: [ball, flag]
      caption: "Circle: water bottle"
    tasks:
      - { type: word_picture, item: bag,   word: "bag",   word_label: "Word:", distractors: [bottle, ball] }
      - { type: word_picture, item: ball,  word: "ball",  word_label: "Word:", distractors: [flag, hoop] }
      - { type: word_picture, item: flag,  word: "flag",  word_label: "Word:", distractors: [bottle, bag] }
      - { type: word_picture, item: shoes, word: "shoes", word_label: "Word:", distractors: [ball, hoop] }
    encouraging_message: "In NIKA we learn step by step. We try, check again, and keep going."
    quick_check:
      type: word_picture
      item: bottle
      word: "water"
      word_label: "Word:"
      distractors: [bag, flag]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "Bonus: Find one picture that matches a word your friend says."
    footer: "בְּנִיקָה מִתְקַדְּמִים יַחַד — לוֹמְדִים, מְנַסִּים וְעוֹזְרִים לַקְּבוּצָה."

  # ── עמוד 2 · ממשיכים ─────────────────────────────
  mid:
    level: mid
    intro: "עַכְשָׁיו נִקְרָא מִלִּים בְּאַנְגְּלִית וְנַתְאִים כָּל מִלָּה לַתְּמוּנָה הַנְּכוֹנָה."
    instruction: "Read the word and circle the matching picture."
    example:
      type: word_picture
      item: ball
      word: "ball"
      word_label: "Word:"
      distractors: [bag, hoop, flag]
      caption: "Circle: ball"
    tasks:
      - { type: word_picture, item: bag,   word: "bag",   word_label: "Word:", distractors: [bottle, ball, flag] }
      - { type: word_picture, item: hoop,  word: "hoop",  word_label: "Word:", distractors: [ball, bag, shoes] }
      - { type: word_picture, item: shoes, word: "shoes", word_label: "Word:", distractors: [flag, bottle, ball] }
      - { type: word_picture, item: flag,  word: "flag",  word_label: "Word:", distractors: [bag, hoop, bottle] }
    encouraging_message: "When we practice, we get better step by step."
    quick_check:
      type: word_picture
      item: hoop
      word: "hoop"
      word_label: "Word:"
      distractors: [ball, bag]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "Partner challenge: Say one word to a friend. Can they find the picture?"
    footer: "בְּנִיקָה מִתְקַדְּמִים יַחַד — מְנַסִּים, מַתְמִידִים וְעוֹזְרִים לַקְּבוּצָה."

  # ── עמוד 3 · אתגר ─────────────────────────────
  challenge:
    level: challenge
    intro: "עַכְשָׁיו נִקְרָא בְּעַצְמֵנוּ מִלִּים בְּאַנְגְּלִית וְנִבְחַר אֶת הַתְּמוּנָה הַנְּכוֹנָה מִבֵּין אֶפְשָׁרֻיּוֹת דּוֹמוֹת."
    instruction: "Read the word by yourself and circle the matching picture."
    example:
      type: word_picture
      item: shoes
      word: "shoes"
      word_label: "Word:"
      distractors: [bag, hoop, flag]
      caption: "Circle: shoes"
    tasks:
      - { type: word_picture, item: flag,   word: "flag",  word_label: "Word:", distractors: [hoop, bag, shoes] }
      - { type: word_picture, item: bottle, word: "water", word_label: "Word:", distractors: [flag, ball, hoop] }
      - { type: word_picture, item: hoop,   word: "hoop",  word_label: "Word:", distractors: [ball, flag, shoes] }
    encouraging_message: "Effort, reading, and practice help us improve every day."
    quick_check:
      type: word_picture
      item: bag
      word: "bag"
      word_label: "Word:"
      distractors: [bottle, ball]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "Make a short sentence about one of the pictures on the page."
    footer: "בְּנִיקָה אֲנַחְנוּ מִתְקַדְּמִים — כָּל יוֹם צַעַד קָטָן קָדִימָה."

  # ── דף מדריך/ה (ללא ניקוד) ─────────────────────────────
  coach_guide:
    daily_goal:
      - "זיהוי מילה באנגלית"
      - "התאמת מילה לתמונה"
      - "קריאה ראשונית של מילים מוכרות"
      - "תחילת הבנה של קשר בין מילה לפריט"
    leading_value:
      name: "מוכנות ואחריות אישית"
      text: "הילד מבין שהיכרות עם הפריטים והשפה עוזרת לו להתארגן טוב יותר לפעילות."
    pages_overview:
      - level: beginner
        audience: "מיועד לילדים שצריכים כניסה פשוטה:"
        points: ["שמיעת מילה", "זיהוי תמונה מוכרת", "בחירה בין 3 אפשרויות"]
      - level: mid
        audience: "מיועד לילדים שיכולים:"
        points: ["זיהוי מילים חזותית", "חיבור בין מילה לתמונה", "בחירה נכונה מתוך כמה אפשרויות"]
      - level: challenge
        audience: "מיועד לילדים שיכולים:"
        points: ["קריאה בביטחון יחסי", "הבנת משפט קצר", "השלמת מילה מתוך הקשר פשוט"]
    how_to_mediate:
      - "לפתוח תמיד מהפתיח ומהדוגמה"
      - "לומר את המילה באנגלית בקול ברור"
      - "לבקש מהילדים לחזור על המילה שוב ושוב"
      - "להשתמש בכרטיסיות מילה נפרדות"
      - "להקטין מספר אפשרויות אם צריך"
      - "לאפשר תשובה בהצבעה או בעל פה"
    adaptations:
      - "להציג משימה אחת בכל פעם"
      - "לחזור על המילה כמה פעמים"
      - "לחבר בין המילה לתנועה או לחפץ אמיתי"
      - "לתת בחירה בין שתי תשובות במקום שלוש"
      - "לאפשר לענות בהצבעה"
    fast_finishers:
      - "לעבור ל'אתגר'"
      - "לתת את הבונוס"
      - "לבקש לומר מילה לחבר"
      - "לבקש לייצר משפט קצר מאוד באנגלית"
    coach_message:
      lead: "הדגש הוא לא על 'מבטא מושלם', אלא על:"
      values: ["ניסיון", "היכרות", "חזרתיות", "ביטחון", "תחושת הצלחה"]
    phrases:
      - "Great try."
      - "You checked again. Excellent."
      - "Well done."
      - "You kept going."
      - "You helped your team."
    footer_legend: ["ניסיון", "היכרות", "חזרתיות", "ביטחון", "תחושת הצלחה"]

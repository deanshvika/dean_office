# ── מחזור 5 · יום 14 · שפה · שכבות ב-ג ─────────────────────────────
# עולם תוכן: בית הספר והחברים | ערך: חברות
# שכבות ב-ג = ללא ניקוד. מתחילים=תמונה→מילה · ממשיכים=בחירת מילה למשפט · אתגר=הבנת הנקרא
# ★ פריטי-אימוג'י (כלי כיתה): עברית על ספר/מחברת/סרגל/מספריים/ילקוט (בידול מ-pencil/pen/... האנגלי).

day_id: grades_2_3_language_day_14
subject: language
audience: grades_2_3

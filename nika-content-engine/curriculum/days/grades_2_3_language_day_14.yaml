pages:

  # ── עמוד 1 · מתחילים · תמונה → מילה (4 אפשרויות) ──────
  beginner:
    level: beginner
    intro: "בשכבות ב-ג קוראים בלי ניקוד. הסתכלו על הכלי ובחרו את שמו הנכון מבין ארבע."
    instruction: "הסתכלו על התמונה ובחרו את המילה המתאימה."
    example:
      type: pic_word
      item: book
      distractors: [ruler, notebook, backpack]
      caption: "בוחרים את המילה המתאימה לתמונה."
    tasks:
      - { type: pic_word, item: notebook, distractors: [book, scissors, ruler] }
      - { type: pic_word, item: ruler,    distractors: [scissors, book, backpack] }
      - { type: pic_word, item: scissors, distractors: [backpack, ruler, notebook] }
      - { type: pic_word, item: backpack, distractors: [book, notebook, scissors] }
    encouraging_message: "כשמכירים את שמות הכלים, קל יותר לעזור לחבר ולעבוד יחד."
    quick_check:
      type: pic_word
      item: ruler
      distractors: [book, notebook, backpack]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "כתבו שני כלי כיתה שאתם מכירים."
    footer: "בניקה מתקדמים יחד — קוראים, מנסים וחולקים עם חברים."

  # ── עמוד 2 · ממשיכים · בחירת מילה למשפט ─────────────────────────────
  mid:
    level: mid
    intro: "עכשיו נשלים משפטים על כלי הכיתה. בחרו את המילה שמתאימה לכל משפט."
    instruction: "קראו את המשפט ובחרו מהמילים את המילה הנכונה."
    example:
      type: complete_sentence
      sentence: "גוזרים נייר עם ___."
      word_bank: [מספריים, סרגל, ספר]
      answer: מספריים
      item: scissors
      caption: "המילה המתאימה: מספריים."
    tasks:
      - { type: complete_sentence, sentence: "מודדים קו ישר עם ___.", word_bank: [סרגל, ספר, מחברת], answer: סרגל, item: ruler }
      - { type: complete_sentence, sentence: "קוראים סיפור מתוך ___.", word_bank: [ספר, מספריים, סרגל], answer: ספר, item: book }
    encouraging_message: "כשאנחנו קוראים בזהירות ועוזרים זה לזה, לומדים ומתקדמים יחד."
    quick_check:
      type: complete_sentence
      sentence: "שמים את הספרים בתוך ה___."
      word_bank: [ילקוט, סרגל, מחברת]
      answer: ילקוט
      item: backpack
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "כתבו משפט אחד על כלי כיתה ומה עושים איתו."
    footer: "בניקה מתקדמים יחד — קוראים, בוחרים ועוזרים."

  # ── עמוד 3 · אתגר · הבנת הנקרא ─────────────────────────────
  challenge:
    level: challenge
    intro: "עכשיו נקרא קטעים קצרים על חברות בכיתה, ונענה על שאלה בכל קטע."
    instruction: "קראו את הקטע וסמנו את התשובה הנכונה."
    example:
      type: reading_comprehension
      passage: "רותם שכחה עיפרון בבית. חברתה נועה נתנה לה עיפרון משלה."
      question: "מה עשתה נועה?"
      options: [נתנה לה עיפרון, צחקה עליה, הלכה משם]
      answer: נתנה לה עיפרון
    tasks:
      - type: reading_comprehension
        passage: "בהפסקה דן ראה ילד חדש יושב לבד. הוא ניגש אליו והזמין אותו לשחק."
        question: "מה עשה דן?"
        options: [הזמין אותו לשחק, התעלם ממנו, צחק עליו]
        answer: הזמין אותו לשחק
      - type: reading_comprehension
        passage: "מאיה ויעל עשו יחד עבודה בכיתה. הן עזרו זו לזו וסיימו מהר."
        question: "למה הן סיימו מהר?"
        options: [כי עזרו זו לזו, כי לא עבדו, כי ויתרו]
        answer: כי עזרו זו לזו
    encouraging_message: "כשמבינים מה קראנו ועוזרים לחברים, הכיתה נעימה לכולם."
    quick_check:
      type: reading_comprehension
      passage: "יוסי נפל בחצר. שני חברים ניגשו ועזרו לו לקום."
      question: "מי עזר ליוסי?"
      options: [שני חברים, אף אחד, המורה]
      answer: שני חברים
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "כתבו משפט אחד: איך עזרתם לחבר היום?"
    footer: "בניקה אנחנו מתקדמים — כל יום צעד קטן קדימה, ביחד."


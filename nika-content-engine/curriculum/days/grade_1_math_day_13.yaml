# ── מחזור 5 · יום 13 · חשבון · שכבה א' ─────────────────────────────
# עולם תוכן: בית הספר והחברים | ערך: סדר וארגון
# דרגות קושי: מתחילים=מנייה · ממשיכים=השוואה+כתיבה · אתגר=חיבור/חיסור+השלמה
# ★ פריטי-אימוג'י (כלי כיתה) מהבנק. חשבון שכבה א' = מנוקד; דף מדריך = ללא ניקוד.

day_id: grade_1_math_day_13
subject: math
audience: grade_1
niqqud: true
day_label: "יוֹם 13 – בֵּית הַסֵּפֶר: מְנִיָּה וְסֵדֶר"
title: "כַּמָּה כֵּלִים יֵשׁ בַּיַּלְקוּט?"
core_skill: "מנייה, השוואה ותחילת חיבור/חיסור"
subskills:
  - "ספירה עד 10"
  - "השוואת כמויות (יותר/פחות)"
  - "חיבור/חיסור והשלמה לשוויון"
theme: "בית הספר והחברים"
leading_value: "סדר וארגון"

pages:

  # ── עמוד 1 · מתחילים · מנייה ─────────────────────────────
  beginner:
    level: beginner
    intro: "לִפְנֵי הַשִּׁעוּר מְסַדְּרִים אֶת הַיַּלְקוּט. בּוֹאוּ נִסְפֹּר כַּמָּה כֵּלִים יֵשׁ."
    instruction: "סִפְרוּ אֶת הַכֵּלִים וְסַמְּנוּ אֶת הַמִּסְפָּר הַמַּתְאִים."
    example:
      type: count
      item: book
      count: 3
      caption: "יֵשׁ 3 סְפָרִים. הַמִּסְפָּר הַמַּתְאִים הוּא:"
    tasks:
      - { type: count, item: notebook, count: 4, options: [3, 4, 5] }
      - { type: count, item: pencil,   count: 5, options: [4, 5, 6] }
      - { type: count, item: backpack, count: 6, options: [5, 6, 7] }
      - { type: count, item: book,     count: 2, options: [1, 2, 3] }
    encouraging_message: "כְּשֶׁסּוֹפְרִים בְּסֵדֶר, יוֹדְעִים בְּדִיּוּק כַּמָּה כֵּלִים יֵשׁ לָנוּ."
    quick_check:
      type: write_count
      groups:
        - { item: notebook, count: 5, line: "סִפְרוּ וְכִתְבוּ: יֵשׁ כָּאן ___ מַחְבָּרוֹת." }
    success_reflection: [tried, improved, persevered]
    bonus:
      type: find_count
      target: 4
      text: "מִצְאוּ צִיּוּר אֶחָד שֶׁבּוֹ יֵשׁ בְּדִיּוּק 4 כֵּלִים."
    footer: "בְּנִיקָה מְסַדְּרִים וְסוֹפְרִים — כִּתָּה מְאֻרְגֶּנֶת וּנְעִימָה."

  # ── עמוד 2 · ממשיכים · השוואה + כתיבה ─────────────────────────────
  mid:
    level: mid
    intro: "עַכְשָׁיו נִבְדֹּק אֵיפֹה יֵשׁ יוֹתֵר כֵּלִים וְאֵיפֹה פָּחוֹת — כְּדֵי לְסַדֵּר."
    instruction: "סִפְרוּ, כִּתְבוּ אֶת הַמִּסְפָּרִים, וְסַמְּנוּ אֵיפֹה יֵשׁ יוֹתֵר אוֹ פָּחוֹת."
    example:
      type: compare
      item: book
      a: 4
      b: 3
      ask: more
      caption: "בִּקְבוּצָה א׳ יֵשׁ 4 סְפָרִים, בִּקְבוּצָה ב׳ יֵשׁ 3. בִּקְבוּצָה א׳ יֵשׁ יוֹתֵר."
    tasks:
      - type: write_count
        groups:
          - { item: notebook, count: 5, line: "בִּקְבוּצָה א׳ יֵשׁ ___" }
          - { item: notebook, count: 3, line: "בִּקְבוּצָה ב׳ יֵשׁ ___" }
      - { type: compare, item: pencil,   a: 5, b: 3, ask: more }
      - { type: compare, item: backpack, a: 4, b: 6, ask: less }
      - type: write_count
        groups:
          - { item: book,     count: 5, line: "יֵשׁ ___ סְפָרִים" }
          - { item: notebook, count: 6, line: "יֵשׁ ___ מַחְבָּרוֹת" }
      - type: match
        prompt: "חַבְּרוּ בְּקַו בֵּין כָּל קְבוּצָה לַמִּסְפָּר הַמַּתְאִים."
        pairs:
          - { item: book,     count: 2, label: "קְבוּצָה א׳" }
          - { item: backpack, count: 4, label: "קְבוּצָה ב׳" }
          - { item: notebook, count: 5, label: "קְבוּצָה ג׳" }
        numbers: [4, 2, 5]
    encouraging_message: "כְּשֶׁבּוֹדְקִים בְּסֵדֶר — סוֹפְרִים נָכוֹן וְלֹא מִתְבַּלְבְּלִים."
    quick_check:
      type: compare
      item: pencil
      a: 5
      b: 3
      ask: more
      line: "סַמְּנוּ: לְאֵיזוֹ קְבוּצָה יֵשׁ יוֹתֵר עֶפְרוֹנוֹת?"
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      title: "אֶתְגָּר זוּגִי"
      text: "בִּדְקוּ עִם חָבֵר אוֹ חֲבֵרָה אִם סְפַרְתֶּם אוֹתוֹ דָּבָר."
    footer: "בְּנִיקָה מִתְקַדְּמִים יַחַד — סוֹפְרִים, בּוֹדְקִים וּמְסַדְּרִים."

  # ── עמוד 3 · אתגר · חיבור/חיסור + השלמה ─────────────────────────────
  challenge:
    level: challenge
    intro: "עַכְשָׁיו נְחַשֵּׁב כַּמָּה כֵּלִים יַחַד, כַּמָּה נִשְׁאֲרוּ, וְנַשְׁלִים כְּדֵי לְסַדֵּר."
    instruction: "סִפְרוּ, חַשְּׁבוּ, וְהַשְׁלִימוּ אֶת הַתְּשׁוּבוֹת."
    example:
      type: arith
      op: addition
      a: { item: book, count: 4 }
      b: { item: book, count: 3 }
      result: 7
      caption: "4 סְפָרִים וְעוֹד 3. כַּמָּה סְפָרִים יַחַד?"
    tasks:
      - type: arith
        op: addition
        a: { item: notebook, count: 4 }
        b: { item: notebook, count: 2 }
        result: 6
        prompt: "עַל הַשֻּׁלְחָן 4 מַחְבָּרוֹת, הוֹסִיפוּ עוֹד 2. כַּמָּה מַחְבָּרוֹת יַחַד?"
      - type: arith
        op: subtraction
        a: { item: pencil, count: 6 }
        b: { item: pencil, count: 2 }
        result: 4
        prompt: "הָיוּ 6 עֶפְרוֹנוֹת, לָקְחוּ 2. כַּמָּה עֶפְרוֹנוֹת נִשְׁאֲרוּ?"
      - type: equalize
        item: book
        a: 5
        b: 3
        answer: 2
        prompt: "בִּקְבוּצָה א׳ 5 סְפָרִים, בִּקְבוּצָה ב׳ 3. כַּמָּה לְהוֹסִיף כְּדֵי שֶׁיִּהְיֶה שָׁוֶה?"
    encouraging_message: "סֵדֶר הוּא לָדַעַת בְּדִיּוּק מַה יֵּשׁ וְאֵיפֹה — יָפֶה שֶׁחִשַּׁבְתֶּם נָכוֹן."
    quick_check:
      type: arith
      op: addition
      a: { item: backpack, count: 3 }
      b: { item: backpack, count: 2 }
      result: 5
      prompt: "כַּמָּה יַחַד: 3 יַלְקוּטִים וְעוֹד 2?"
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "הַמְצִיאוּ תַּרְגִּיל חִבּוּר עַל כְּלֵי כִּתָּה שֶׁהַתְּשׁוּבָה שֶׁלּוֹ הִיא 6."
    footer: "בְּנִיקָה אֲנַחְנוּ מִתְקַדְּמִים — כָּל יוֹם צַעַד קָטָן קָדִימָה."

  # ── דף מדריך/ה (ללא ניקוד) ─────────────────────────────
  coach_guide:
    daily_goal:
      - "מנייה מדויקת של כלי כיתה עד 10"
      - "השוואת כמויות (יותר/פחות)"
      - "חיבור/חיסור והשלמה לשוויון"
      - "חיבור המספרים לרעיון של סדר וארגון"
    leading_value:
      name: "סדר וארגון"
      text: "ספירה מדויקת עוזרת לשמור על סדר — כשיודעים כמה כלים יש, קל לארגן את הכיתה ואת הילקוט."
    pages_overview:
      - level: beginner
        audience: "מיועד לילדים שצריכים בסיס מוצק:"

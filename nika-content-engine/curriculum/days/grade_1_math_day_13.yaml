      - "לתת את הבונוס"
      - "לבקש להמציא תרגיל דומה"
      - "לבקש לסדר קבוצה שווה"
    coach_message:
      lead: "הדגש הוא לא רק על תשובה נכונה, אלא על:"
      values: ["דיוק", "סדר וארגון", "סבלנות", "אחריות"]
    phrases:
      - "כל הכבוד שספרת בדיוק."

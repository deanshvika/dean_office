      - level: mid
        audience: "מיועד לילדים שיכולים:"
        points: ["לספור ולכתוב מספר", "להשוות יותר/פחות", "לחבר כמות למספר"]
      - level: challenge
        audience: "מיועד לילדים שיכולים:"
        points: ["לחבר ולחסר עד 10", "להשלים לשוויון", "לפתור מתוך הקשר"]
    how_to_mediate:
      - "לפתוח תמיד מהפתיח ומהדוגמה"
      - "בספירה — להצביע על כל כלי תוך אמירת המספר בקול"
      - "בהשוואה — לספור כל קבוצה ואז לשאול 'איפה יש יותר?'"
      - "בחיבור/חיסור — להיעזר בכלים המצוירים"
      - "לחבר לערך: 'איך מסדרים את הכלים בילקוט?'"
    adaptations:

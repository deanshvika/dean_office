# ── מחזור 3 · יום 8 · שפה · שכבה א' ─────────────────────────────
# עולם תוכן: גוף ובריאות | ערך: התמדה והקשבה לגוף
# דרגות קושי: מתחילים=מילה→תמונה · ממשיכים=תמונה→מילה · אתגר=אות חסרה
# ★ בידול מ"אנגלית": עברית על סט אוזן/רגל/אצבע/לשון/עין (אנגלית על hand/nose/mouth/tooth/heart).
# שפה שכבה א' = ניקוד מלא; מילים ואותיות מהבנק המנוקד.

day_id: grade_1_language_day_8
subject: language
audience: grade_1
niqqud: true
day_label: "יוֹם 8 – הַגּוּף: מִלָּה, תְּמוּנָה וְאוֹת"
title: "מַכִּירִים אֶת הַגּוּף שֶׁלָּנוּ"
core_skill: "זיהוי מילה, קריאתה, וניתוח האות החסרה — בעולם הגוף"
subskills:
  - "התאמת מילה לתמונה של חלק גוף"
  - "קריאת מילה ובחירתה"
  - "זיהוי אות חסרה במילה"
theme: "גוף ובריאות"
leading_value: "התמדה"

pages:

  # ── עמוד 1 · מתחילים · מילה → תמונה ─────────────────────────────
  beginner:
    level: beginner
    intro: "לַגּוּף שֶׁלָּנוּ יֵשׁ הַרְבֵּה חֲלָקִים. בּוֹאוּ נַכִּיר אוֹתָם וְנִלְמַד לְהַקְשִׁיב לָהֶם."
    instruction: "קִרְאוּ אֶת הַמִּלָּה, וְהַקִּיפוּ אֶת הַתְּמוּנָה הַמַּתְאִימָה."
    example:
      type: word_picture
      item: ear
      distractors: [leg, eye]
      caption: "מַקִּיפִים אֶת הַתְּמוּנָה הַמַּתְאִימָה."
    tasks:
      - { type: word_picture, item: leg,    distractors: [ear, finger] }
      - { type: word_picture, item: finger, distractors: [tongue, eye] }
      - { type: word_picture, item: eye,    distractors: [leg, ear] }
      - { type: word_picture, item: tongue, distractors: [finger, leg] }
    encouraging_message: "כְּשֶׁאֲנַחְנוּ מַכִּירִים אֶת הַגּוּף, אֲנַחְנוּ יוֹדְעִים לִשְׁמֹר עָלָיו."
    quick_check:
      type: word_picture
      item: eye
      distractors: [ear, leg]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "הַרְאוּ חֵלֶק גּוּף אֶחָד וְאִמְרוּ אֶת הַשֵּׁם שֶׁלּוֹ."
    footer: "בְּנִיקָה מִתְקַדְּמִים יַחַד — קוֹרְאִים, מְנַסִּים וּמַתְמִידִים."

  # ── עמוד 2 · ממשיכים · תמונה → מילה ─────────────────────────────
  mid:
    level: mid
    intro: "עַכְשָׁיו נִסְתַּכֵּל עַל הַתְּמוּנָה וְנִבְחַר אֶת הַמִּלָּה הַנְּכוֹנָה."
    instruction: "הִסְתַּכְּלוּ עַל הַתְּמוּנָה וְסַמְּנוּ אֶת הַמִּלָּה הַמַּתְאִימָה."
    example:
      type: pic_word
      item: ear
      distractors: [leg, tongue]
      caption: "בּוֹחֲרִים אֶת הַמִּלָּה הַמַּתְאִימָה לַתְּמוּנָה."
    tasks:
      - { type: pic_word, item: leg,    distractors: [ear, finger] }
      - { type: pic_word, item: finger, distractors: [eye, ear] }
      - { type: pic_word, item: tongue, distractors: [leg, finger] }
      - { type: pic_word, item: eye,    distractors: [ear, leg] }
    encouraging_message: "כְּשֶׁאֲנַחְנוּ מְנַסִּים שׁוּב וּמַתְמִידִים, אֲנַחְנוּ לוֹמְדִים וּמִתְקַדְּמִים."
    quick_check:
      type: pic_word
      item: finger
      distractors: [ear, leg]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "אִמְרוּ מִלָּה שֶׁל חֵלֶק גּוּף לְחָבֵר, וּבִדְקוּ אִם מָצָא אוֹתָהּ."
    footer: "בְּנִיקָה מִתְקַדְּמִים יַחַד — מְנַסִּים, מַתְמִידִים וּמַקְשִׁיבִים לַגּוּף."

  # ── עמוד 3 · אתגר · אות חסרה ─────────────────────────────
  challenge:
    level: challenge
    intro: "עַכְשָׁיו נִמְצָא אֵיזוֹ אוֹת חֲסֵרָה בְּשֵׁם חֵלֶק הַגּוּף, וְנַשְׁלִים אוֹתָהּ."
    instruction: "הַשְׁלִימוּ אֶת הָאוֹת הַחֲסֵרָה בְּכָל מִלָּה."
    example:
      type: missing_letter
      item: ear
      answer: "ז"
      options: ["ז", "מ", "ת"]
      caption: "מַשְׁלִימִים אֶת הָאוֹת הַחֲסֵרָה בַּמִּלָּה."
    tasks:
      - { type: missing_letter, item: leg,    answer: "ג", options: ["ג", "מ", "ת"] }
      - { type: missing_letter, item: finger, answer: "ב", options: ["ב", "מ", "ל"] }
      - { type: missing_letter, item: tongue, answer: "ש", options: ["ש", "מ", "ת"] }
    encouraging_message: "מַאֲמָץ, קְרִיאָה וְהַתְמָדָה עוֹזְרִים לָנוּ לְהִשְׁתַּפֵּר בְּכָל יוֹם."
    quick_check:
      type: missing_letter
      item: eye
      answer: "י"
      options: ["י", "ו", "מ"]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "הַמְצִיאוּ מִשְׁפָּט קָצָר עַל אֶחָד מֵחֶלְקֵי הַגּוּף."
    footer: "בְּנִיקָה אֲנַחְנוּ מִתְקַדְּמִים — כָּל יוֹם צַעַד קָטָן קָדִימָה."

  # ── דף מדריך/ה (ללא ניקוד) ─────────────────────────────
  coach_guide:
    daily_goal:
      - "התאמת שם חלק גוף לתמונה (זיהוי)"
      - "בחירת המילה הנכונה לפי תמונה (קריאה)"
      - "זיהוי והשלמת אות חסרה (ניתוח)"
      - "חיזוק הקשר בין צליל, אות ומילה"
    leading_value:
      name: "התמדה"
      text: "היכרות עם הגוף מחזקת הקשבה לעצמנו — לומדים בהתמדה, חלק אחר חלק, ומטפחים בריאות."
    pages_overview:
      - level: beginner
        audience: "מיועד לילדים שצריכים כניסה פשוטה:"
        points: ["שמיעת מילה", "זיהוי חלק הגוף המתאים", "בחירה בין 3 אפשרויות"]
      - level: mid
        audience: "מיועד לילדים שיכולים:"
        points: ["להסתכל על תמונה ולקרוא", "לבחור את המילה הנכונה", "להבחין בין מילים דומות"]
      - level: challenge
        audience: "מיועד לילדים שיכולים:"
        points: ["לקרוא מילה בביטחון יחסי", "לזהות איזו אות חסרה", "להשלים את המילה"]
    how_to_mediate:
      - "לפתוח תמיד מהפתיח ומהדוגמה"
      - "לומר את שם החלק בקול ברור ולבקש מהילד לחזור ולגעת בו"
      - "בעמוד האות החסרה — לקרוא את המילה בלי האות ולשאול 'איזה צליל חסר?'"
      - "לחבר לערך: 'איך שומרים על החלק הזה בגוף?'"
      - "אם צריך, להישאר רק בעמוד 'מתחילים'"
    adaptations:
      - "להציג משימה אחת בכל פעם"
      - "לומר את המילה בקול שוב ושוב"
      - "להשתמש בכרטיסיות מילה/אות נפרדות"
      - "להקטין מספר אפשרויות אם צריך"
      - "לאפשר תשובה בהצבעה או בעל פה"
    fast_finishers:
      - "לעבור ל'אתגר'"
      - "לתת את הבונוס"
      - "לבקש להצביע על החלק בגוף ולומר את שמו"
      - "לבקש לייצר משפט קצר מאוד"
    coach_message:
      lead: "הדגש הוא לא על 'קריאה מושלמת', אלא על:"
      values: ["התמדה", "הקשבה לגוף", "חזרתיות", "ביטחון"]
    phrases:
      - "כל הכבוד שהתמדת."
      - "יפה שהקשבת לגוף שלך."
      - "מצאת את האות החסרה."
      - "קראת שוב וזה מעולה."
      - "התקדמת יפה."
    footer_legend: ["התמדה", "הקשבה לגוף", "חזרתיות", "ביטחון", "תחושת הצלחה"]

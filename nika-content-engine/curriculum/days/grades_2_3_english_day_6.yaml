# ── מחזור 2 · יום 6 · אנגלית · שכבות ב-ג ─────────────────────────────
# עולם תוכן: החי | ערך: סקרנות
# ב-ג: מתחילים=picture→word(4) · ממשיכים=spell_choice · אתגר=complete sentence
# בידול מ"שפה": אנגלית על סט frog/bee/lion/turtle/butterfly. איות שגוי = אי-מילה ברורה (לא מילה אמיתית).
# שכבות ב-ג = ללא ניקוד (הוראות עברית plain; אנגלית plain). פריטי-אימוג'י מהבנק.

day_id: grades_2_3_english_day_6
subject: english
audience: grades_2_3
niqqud: false
day_label: "יום 6 – Animals: Words and Spelling"
title: "Animals we love"
core_skill: "אוצר חיות באנגלית, זיהוי מילה, איות נכון והשלמת משפט"
subskills:
  - "זיהוי שם חיה לפי תמונה (4 אפשרויות)"
  - "בחירת האיות הנכון של שם חיה"
  - "השלמת משפט מבנק מילים"
theme: "החי"
leading_value: "סקרנות"

pages:

  # ── עמוד 1 · מתחילים · picture → word (4 אפשרויות) ─────────
  beginner:
    level: beginner
    intro: "בשכבות ב-ג מרחיבים את אוצר החיות באנגלית. הסתכלו על החיה ובחרו את המילה הנכונה מבין ארבע."
    instruction: "Look at the animal and choose the correct word (4 choices)."
    example:
      type: pic_word
      item: frog
      distractors: [bee, lion, turtle]
      caption: "Choose the word: frog"
    tasks:
      - { type: pic_word, item: bee,       distractors: [frog, turtle, lion] }
      - { type: pic_word, item: lion,      distractors: [bee, frog, butterfly] }
      - { type: pic_word, item: turtle,    distractors: [lion, bee, frog] }
      - { type: pic_word, item: butterfly, distractors: [frog, turtle, lion] }
    encouraging_message: "In NIKA everyone is curious. Everyone can learn new animal words."
    quick_check:
      type: pic_word
      item: lion
      distractors: [frog, bee, turtle]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "Write two English animal words you know."
    footer: "בניקה מתקדמים יחד — לומדים, מנסים וסקרנים."

  # ── עמוד 2 · ממשיכים · spell_choice ─────────────
  mid:
    level: mid
    intro: "עכשיו נקרא בדיוק: לכל חיה נבחר את המילה שכתובה נכון באנגלית."
    instruction: "Look at the animal. Choose the word that is spelled correctly."
    example:
      type: spell_choice
      item: frog
      options: [frog, frogg, frok]
      answer: frog
      caption: "The correct spelling is: frog"
    tasks:
      - { type: spell_choice, item: lion,      options: [lion, liom, lionn],          answer: lion }
      - { type: spell_choice, item: turtle,    options: [turtle, turtel, tertle],     answer: turtle }
      - { type: spell_choice, item: bee,       options: [bee, beee, bhee],            answer: bee }
      - { type: spell_choice, item: butterfly, options: [butterfly, buterfly, butterflie], answer: butterfly }
    encouraging_message: "When we practice together, everyone improves — step by step."
    quick_check:
      type: spell_choice
      item: turtle
      options: [turtle, turttle, turtl]
      answer: turtle
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "Point to an animal and say the word in English to a friend."
    footer: "בניקה מתקדמים יחד — מנסים, מתמידים וסקרנים."

  # ── עמוד 3 · אתגר · complete sentence ─────────────────────────────
  challenge:
    level: challenge
    intro: "עכשיו נקרא משפט באנגלית על חיה ונשלים אותו מתוך בנק מילים."
    instruction: "Read the sentence and choose the correct word from the word bank."
    example:
      type: complete_sentence
      sentence: "The ___ jumps in the pond."
      word_bank: [frog, bee, lion]
      answer: frog
      item: frog
      caption: "The word that fits is: frog"
    tasks:
      - { type: complete_sentence, sentence: "The ___ flies to the flower.", word_bank: [bee, turtle, lion], answer: bee,    item: bee }
      - { type: complete_sentence, sentence: "The ___ walks very slowly.",   word_bank: [turtle, frog, bee], answer: turtle, item: turtle }
    encouraging_message: "Great curiosity! When everyone joins in, we all find the right word."
    quick_check:
      type: complete_sentence
      sentence: "The ___ is the king of the animals."
      word_bank: [lion, bee, frog]
      answer: lion
      item: lion
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "Write your own short sentence in English about an animal."
    footer: "בניקה אנחנו מתקדמים — כל יום צעד קטן קדימה, ביחד."

  # ── דף מדריך/ה ─────────────────────────────
  coach_guide:
    daily_goal:
      - "זיהוי שם חיה לפי תמונה (4 אפשרויות)"
      - "בחירת האיות הנכון של מילה"
      - "השלמת משפט קצר מבנק מילים"
      - "קריאה ואיות מדויקים באנגלית"
    leading_value:
      name: "סקרנות"
      text: "עולם החי מזמין לגלות — הסקרנות דוחפת את התלמיד ללמוד שמות, איות ומשפטים חדשים."
    pages_overview:
      - level: beginner
        audience: "מיועד לתלמידים שיכולים:"
        points: ["לזהות חיה לפי תמונה", "לבחור מבין 4 אפשרויות", "אוצר חיות מורחב"]
      - level: mid
        audience: "מיועד לתלמידים שיכולים:"
        points: ["לקרוא מילה בדיוק", "לבחור את האיות הנכון", "להבחין בין איות נכון לשגוי"]
      - level: challenge
        audience: "מיועד לתלמידים שיכולים:"
        points: ["לקרוא משפט קצר באנגלית", "לבחור מילה מבנק מילים", "להשלים משפט לפי ההקשר"]
    how_to_mediate:
      - "לפתוח תמיד מהפתיח ומהדוגמה"
      - "לומר את שם החיה באנגלית בקול ולבקש לחזור"
      - "באיות — להשוות אות-אות בין האפשרויות ולמצוא את השגיאה"
      - "במשפט — לקרוא יחד ולבדוק איזו חיה הגיונית"
      - "לעורר סקרנות על החיה ועל שמה"
    adaptations:
      - "להציג משימה אחת בכל פעם"
      - "לחזור על המילה כמה פעמים"
      - "לחבר בין המילה לחיה אמיתית"
      - "לתת בחירה בין שתי תשובות במקום שלוש"
      - "לאפשר תשובה בהצבעה"
    fast_finishers:
      - "לעבור ל'אתגר'"
      - "לתת את הבונוס"
      - "לבקש לומר משפט קצר באנגלית על חיה"
      - "לבקש למצוא חיה נוספת ולומר את שמה"
    coach_message:
      lead: "הדגש הוא לא על 'מבטא מושלם', אלא על:"
      values: ["סקרנות", "ניסיון", "חזרתיות", "ביטחון", "תחושת הצלחה"]
    phrases:
      - "Great try."
      - "You are curious."
      - "You read it well."
      - "You helped your friend."
      - "You kept going."
    footer_legend: ["סקרנות", "ניסיון", "חזרתיות", "ביטחון", "תחושת הצלחה"]

# ── מחזור 1 · יום 2 · שפה · שכבות ב-ג ─────────────────────────────
# עולם תוכן: ספורט וקבוצה | ערך: שיתוף פעולה
# דרגות קושי (ב-ג): מתחילים=קריאת מילה↔תמונה · ממשיכים=בחירת מילה למשפט · אתגר=הבנת הנקרא
# שכבות ב-ג = ללא ניקוד (קריאה שוטפת). בידול מאנגלית (#7): עברית על סט A (דגל/חישוק/נעליים/מדליה/משרוקית/כובע).

day_id: grades_2_3_language_day_2
subject: language
audience: grades_2_3
niqqud: false
day_label: "יום 2 – קריאה, משפט והבנה"
title: "מה עושים יחד בקבוצה?"
core_skill: "קריאה שוטפת, בחירת מילה למשפט והבנת הנקרא"
subskills:
  - "קריאת מילה והתאמתה לתמונה"
  - "בחירת המילה הנכונה למשפט"
  - "הבנת קטע קצר"
theme: "ספורט וקבוצה"
leading_value: "שיתוף פעולה"

pages:

  # ── עמוד 1 · מתחילים · קריאת מילה → תמונה ─────────────────────────────
  beginner:
    level: beginner
    intro: "כדי לעבוד יחד טוב, כדאי להכיר את שמות הציוד. קראו כל מילה והתאימו לתמונה."
    instruction: "קראו את המילה והקיפו את התמונה המתאימה."
    example:
      type: word_picture
      item: flag
      distractors: [hoop, hat]
      caption: "מקיפים את התמונה של דגל."
    tasks:
      - { type: word_picture, item: hoop,    distractors: [flag, shoes] }
      - { type: word_picture, item: medal,   distractors: [whistle, hat] }
      - { type: word_picture, item: whistle, distractors: [hoop, medal] }
      - { type: word_picture, item: shoes,   distractors: [flag, hat] }
    encouraging_message: "כשכל אחד מכיר את הציוד, קל יותר לעבוד יחד ולעזור זה לזה."
    quick_check:
      type: word_picture
      item: hat
      distractors: [medal, flag]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "כתבו שתי מילים של ציוד ספורט שאתם מכירים."
    footer: "בניקה מתקדמים יחד — קוראים, מנסים ועוזרים לקבוצה."

  # ── עמוד 2 · ממשיכים · בחירת מילה למשפט ─────────────────────────────
  mid:
    level: mid
    intro: "עכשיו נשלים משפטים על עבודת הקבוצה. בחרו את המילה שמתאימה לכל משפט."
    instruction: "קראו את המשפט ובחרו מהמילים את המילה הנכונה."
    example:
      type: complete_sentence
      sentence: "הקבוצה מניפה את ה___ לפני המשחק."
      word_bank: [דגל, חישוק, כובע]
      answer: דגל
      item: flag
      caption: "המילה המתאימה: דגל."
    tasks:
      - { type: complete_sentence, sentence: "השחקן נועל ___ נוחות למגרש.", word_bank: [נעליים, כובע, מדליה], answer: נעליים, item: shoes }
      - { type: complete_sentence, sentence: "המאמן שורק ב___ כדי להתחיל.", word_bank: [משרוקית, חישוק, דגל], answer: משרוקית, item: whistle }
      - { type: complete_sentence, sentence: "האלוף קיבל ___ על ההישג.", word_bank: [מדליה, נעליים, דגל], answer: מדליה, item: medal }
    encouraging_message: "כשאנחנו קוראים בשיתוף ובוחרים יחד, לומדים מהר יותר."
    quick_check:
      type: complete_sentence
      sentence: "קופצים דרך ה___ בתרגיל."
      word_bank: [חישוק, כובע, מדליה]
      answer: חישוק
      item: hoop
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "כתבו משפט אחד על המשחק, והשתמשו במילה 'קבוצה'."
    footer: "בניקה מתקדמים יחד — קוראים, בוחרים ועוזרים לקבוצה."

  # ── עמוד 3 · אתגר · הבנת הנקרא ─────────────────────────────
  challenge:
    level: challenge
    intro: "עכשיו נקרא קטעים קצרים על שיתוף פעולה, ונענה על שאלה בכל קטע."
    instruction: "קראו את הקטע וסמנו את התשובה הנכונה."
    example:
      type: reading_comprehension
      passage: "הקבוצה הגיעה למגרש. כל שחקן הביא בקבוק ודגל, ויחד הכינו את המגרש."
      question: "מה הביא כל שחקן?"
      options: [בקבוק ודגל, כדור בלבד, מדליה]
      answer: בקבוק ודגל
    tasks:
      - type: reading_comprehension
        passage: "דנה שכחה את הכובע. חברתה נועה נתנה לה כובע נוסף, ודנה שמחה מאוד."
        question: "מי עזרה לדנה?"
        options: [נועה, המאמן, אף אחד]
        answer: נועה
      - type: reading_comprehension
        passage: "הקבוצה חילקה את המשימות. כל אחד לקח תפקיד, וככה העבודה הייתה מהירה."
        question: "למה העבודה הייתה מהירה?"
        options: [כי חילקו משימות, כי היו עצלים, כי לא עבדו]
        answer: כי חילקו משימות
    encouraging_message: "כשמבינים מה קראנו ועוזרים זה לזה, הקבוצה מצליחה יותר."
    quick_check:
      type: reading_comprehension
      passage: "יובל לא היה ראשון במרוץ, אבל הוא לא ויתר וסיים בחיוך."
      question: "מה עשה יובל כשלא היה ראשון?"
      options: [לא ויתר, הפסיק לרוץ, כעס]
      answer: לא ויתר
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "כתבו משפט אחד: איך אתם עוזרים לחבר בקבוצה?"
    footer: "בניקה אנחנו מתקדמים — כל יום צעד קטן קדימה, ביחד."


# ── מחזור 4 · יום 10 · חשבון · שכבה א' ─────────────────────────────
# עולם תוכן: אוכל בריא | ערך: מידה ואיזון
# דרגות קושי: מתחילים=מנייה · ממשיכים=השוואה+כתיבה · אתגר=חיבור/חיסור+השלמה
# ★ פריטי-אימוג'י (מזון) מהבנק. חשבון שכבה א' = מנוקד; דף מדריך = ללא ניקוד.

day_id: grade_1_math_day_10
subject: math
audience: grade_1
niqqud: true
day_label: "יוֹם 10 – אֹכֶל בָּרִיא: מְנִיָּה וְאִזּוּן"
title: "כַּמָּה פֵּרוֹת יֵשׁ לָנוּ?"
core_skill: "מנייה, השוואה ותחילת חיבור/חיסור"
subskills:
  - "ספירה עד 10"
  - "השוואת כמויות (יותר/פחות)"
  - "חיבור/חיסור והשלמה לשוויון"
theme: "אוכל בריא"
leading_value: "מידה ואיזון"

pages:

  # ── עמוד 1 · מתחילים · מנייה ─────────────────────────────
  beginner:
    level: beginner
    intro: "בַּמִּטְבָּח הַבָּרִיא סוֹפְרִים כַּמָּה פֵּרוֹת וִירָקוֹת יֵשׁ. בּוֹאוּ נִסְפֹּר לְאַט וּבְדִיּוּק."
    instruction: "סִפְרוּ אֶת הַפֵּרוֹת וְסַמְּנוּ אֶת הַמִּסְפָּר הַמַּתְאִים."
    example:
      type: count
      item: apple
      count: 3
      caption: "יֵשׁ 3 תַּפּוּחִים. הַמִּסְפָּר הַמַּתְאִים הוּא:"
    tasks:
      - { type: count, item: banana, count: 4, options: [3, 4, 5] }
      - { type: count, item: egg,    count: 5, options: [4, 5, 6] }
      - { type: count, item: carrot, count: 6, options: [5, 6, 7] }
      - { type: count, item: orange, count: 2, options: [1, 2, 3] }
    encouraging_message: "כְּשֶׁסּוֹפְרִים בְּדִיּוּק, יוֹדְעִים כַּמָּה יֵשׁ — זוֹ מִדָּה נְכוֹנָה."
    quick_check:
      type: write_count
      groups:
        - { item: apple, count: 5, line: "סִפְרוּ וְכִתְבוּ: יֵשׁ כָּאן ___ תַּפּוּחִים." }
    success_reflection: [tried, improved, persevered]
    bonus:
      type: find_count
      target: 4
      text: "מִצְאוּ צִיּוּר אֶחָד שֶׁבּוֹ יֵשׁ בְּדִיּוּק 4 פֵּרוֹת."
    footer: "בְּנִיקָה סוֹפְרִים בְּדִיּוּק — אוֹכְלִים בָּרִיא וּבְמִדָּה."

  # ── עמוד 2 · ממשיכים · השוואה + כתיבה ─────────────────────────────
  mid:
    level: mid
    intro: "עַכְשָׁיו נִבְדֹּק אֵיפֹה יֵשׁ יוֹתֵר פֵּרוֹת וְאֵיפֹה פָּחוֹת — כְּדֵי לְאַזֵּן."
    instruction: "סִפְרוּ, כִּתְבוּ אֶת הַמִּסְפָּרִים, וְסַמְּנוּ אֵיפֹה יֵשׁ יוֹתֵר אוֹ פָּחוֹת."
    example:
      type: compare
      item: apple
      a: 4
      b: 3
      ask: more
      caption: "בִּקְבוּצָה א׳ יֵשׁ 4 תַּפּוּחִים, בִּקְבוּצָה ב׳ יֵשׁ 3. בִּקְבוּצָה א׳ יֵשׁ יוֹתֵר."
    tasks:
      - type: write_count
        groups:
          - { item: banana, count: 5, line: "בִּקְבוּצָה א׳ יֵשׁ ___" }
          - { item: banana, count: 3, line: "בִּקְבוּצָה ב׳ יֵשׁ ___" }
      - { type: compare, item: egg,    a: 5, b: 3, ask: more }
      - { type: compare, item: carrot, a: 4, b: 6, ask: less }
      - type: write_count
        groups:
          - { item: apple, count: 5, line: "יֵשׁ ___ תַּפּוּחִים" }
          - { item: egg,   count: 6, line: "יֵשׁ ___ בֵּיצִים" }
      - type: match
        prompt: "חַבְּרוּ בְּקַו בֵּין כָּל קְבוּצָה לַמִּסְפָּר הַמַּתְאִים."
        pairs:
          - { item: apple,  count: 2, label: "קְבוּצָה א׳" }
          - { item: carrot, count: 4, label: "קְבוּצָה ב׳" }
          - { item: banana, count: 5, label: "קְבוּצָה ג׳" }
        numbers: [4, 2, 5]
    encouraging_message: "כְּשֶׁבּוֹדְקִים לְאַט — סוֹפְרִים נָכוֹן וְשׁוֹמְרִים עַל אִזּוּן."
    quick_check:
      type: compare
      item: egg
      a: 5
      b: 3
      ask: more
      line: "סַמְּנוּ: לְאֵיזוֹ קְבוּצָה יֵשׁ יוֹתֵר בֵּיצִים?"
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      title: "אֶתְגָּר זוּגִי"
      text: "בִּדְקוּ עִם חָבֵר אוֹ חֲבֵרָה אִם סְפַרְתֶּם אוֹתוֹ דָּבָר."
    footer: "בְּנִיקָה מִתְקַדְּמִים יַחַד — סוֹפְרִים, בּוֹדְקִים וּמְאַזְּנִים."

  # ── עמוד 3 · אתגר · חיבור/חיסור + השלמה ─────────────────────────────
  challenge:
    level: challenge
    intro: "עַכְשָׁיו נְחַשֵּׁב כַּמָּה פֵּרוֹת יַחַד, כַּמָּה נִשְׁאֲרוּ, וְנַשְׁלִים לְאִזּוּן."
    instruction: "סִפְרוּ, חַשְּׁבוּ, וְהַשְׁלִימוּ אֶת הַתְּשׁוּבוֹת."
    example:
      type: arith
      op: addition
      a: { item: apple, count: 4 }
      b: { item: apple, count: 3 }
      result: 7
      caption: "4 תַּפּוּחִים וְעוֹד 3. כַּמָּה תַּפּוּחִים יַחַד?"
    tasks:
      - type: arith
        op: addition
        a: { item: banana, count: 4 }
        b: { item: banana, count: 2 }
        result: 6
        prompt: "בַּסַּל 4 בָּנָנוֹת, הוֹסִיפוּ עוֹד 2. כַּמָּה בָּנָנוֹת יַחַד?"
      - type: arith
        op: subtraction
        a: { item: egg, count: 6 }
        b: { item: egg, count: 2 }
        result: 4
        prompt: "הָיוּ 6 בֵּיצִים, לָקְחוּ 2. כַּמָּה בֵּיצִים נִשְׁאֲרוּ?"
      - type: equalize
        item: apple
        a: 5
        b: 3
        answer: 2
        prompt: "בִּקְבוּצָה א׳ 5 תַּפּוּחִים, בִּקְבוּצָה ב׳ 3. כַּמָּה לְהוֹסִיף כְּדֵי שֶׁיִּהְיֶה שָׁוֶה?"
    encouraging_message: "אִזּוּן הוּא לָתֵת לְכָל אֶחָד מִדָּה נְכוֹנָה — יָפֶה שֶׁחִשַּׁבְתֶּם בְּדִיּוּק."
    quick_check:
      type: arith
      op: addition
      a: { item: orange, count: 3 }
      b: { item: orange, count: 2 }
      result: 5
      prompt: "כַּמָּה יַחַד: 3 תַּפּוּזִים וְעוֹד 2?"
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "הַמְצִיאוּ תַּרְגִּיל חִבּוּר עַל פֵּרוֹת שֶׁהַתְּשׁוּבָה שֶׁלּוֹ הִיא 6."
    footer: "בְּנִיקָה אֲנַחְנוּ מִתְקַדְּמִים — כָּל יוֹם צַעַד קָטָן קָדִימָה."

  # ── דף מדריך/ה (ללא ניקוד) ─────────────────────────────
  coach_guide:
    daily_goal:
      - "מנייה מדויקת של פריטי מזון עד 10"
      - "השוואת כמויות (יותר/פחות)"
      - "חיבור/חיסור והשלמה לשוויון"
      - "חיבור המספרים לרעיון של מידה ואיזון באוכל"
    leading_value:
      name: "מידה ואיזון"
      text: "ספירה מדויקת עוזרת לתת לכל אחד מנה הוגנת — כמו אוכל בריא: לא יותר מדי ולא מעט מדי, באיזון."
    pages_overview:
      - level: beginner
        audience: "מיועד לילדים שצריכים בסיס מוצק:"
        points: ["ספירת פריטים עד 6", "התאמת כמות למספר", "בחירה בין 3 אפשרויות"]
      - level: mid
        audience: "מיועד לילדים שיכולים:"
        points: ["לספור ולכתוב מספר", "להשוות יותר/פחות", "לחבר כמות למספר"]
      - level: challenge
        audience: "מיועד לילדים שיכולים:"
        points: ["לחבר ולחסר עד 10", "להשלים לשוויון", "לפתור מתוך הקשר"]
    how_to_mediate:
      - "לפתוח תמיד מהפתיח ומהדוגמה"
      - "בספירה — להצביע על כל פריט תוך אמירת המספר בקול"
      - "בהשוואה — לספור כל קבוצה ואז לשאול 'איפה יש יותר?'"
      - "בחיבור/חיסור — להיעזר בפריטים המצוירים"
      - "לחבר לערך: 'איך נותנים לכולם מידה שווה?'"
    adaptations:
      - "להציג משימה אחת בכל פעם"
      - "לאפשר ספירה עם האצבע על הציור"
      - "להתחיל ממספרים קטנים"
      - "להקטין מספר אפשרויות אם צריך"
      - "לאפשר תשובה בעל פה"
    fast_finishers:
      - "לעבור ל'אתגר'"
      - "לתת את הבונוס"
      - "לבקש להמציא תרגיל דומה"
      - "לבקש לצייר קבוצה שווה"
    coach_message:
      lead: "הדגש הוא לא רק על תשובה נכונה, אלא על:"
      values: ["דיוק", "מידה ואיזון", "סבלנות", "בחירה בריאה"]
    phrases:
      - "כל הכבוד שספרת בדיוק."
      - "ראיתי שבדקת שוב."
      - "איזנת יפה בין הקבוצות."
      - "חישבת בסבלנות."
      - "התקדמת יפה."
    footer_legend: ["מידה ואיזון", "דיוק", "מאמץ", "בחירה בריאה", "תחושת הצלחה"]

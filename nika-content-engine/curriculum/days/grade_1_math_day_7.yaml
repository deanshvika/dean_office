# ── מחזור 3 · יום 7 · חשבון · שכבה א' ─────────────────────────────
# עולם תוכן: גוף ובריאות | ערך: התמדה והקשבה לגוף
# דרגות קושי: מתחילים=מנייה · ממשיכים=השוואה+כתיבה · אתגר=חיבור/חיסור+השלמה
# ★ פריטי-אימוג'י (חלקי גוף) מהבנק. חשבון שכבה א' = מנוקד; דף מדריך = ללא ניקוד.

day_id: grade_1_math_day_7
subject: math
audience: grade_1
niqqud: true
day_label: "יוֹם 7 – הַגּוּף: מְנִיָּה וְכַמּוּת"
title: "כַּמָּה יֵשׁ בַּגּוּף שֶׁלָּנוּ?"
core_skill: "מנייה, השוואה ותחילת חיבור/חיסור"
subskills:
  - "ספירה עד 10"
  - "השוואת כמויות (יותר/פחות)"
  - "חיבור/חיסור והשלמה לשוויון"
theme: "גוף ובריאות"
leading_value: "התמדה"

pages:

  # ── עמוד 1 · מתחילים · מנייה ─────────────────────────────
  beginner:
    level: beginner
    intro: "בְּשִׁעוּר הַהִתְעַמְּלוּת סוֹפְרִים חֶלְקֵי גּוּף. בּוֹאוּ נִסְפֹּר כַּמָּה יֵשׁ."
    instruction: "סִפְרוּ אֶת חֶלְקֵי הַגּוּף וְסַמְּנוּ אֶת הַמִּסְפָּר הַמַּתְאִים."
    example:
      type: count
      item: finger
      count: 4
      caption: "יֵשׁ 4 אֶצְבָּעוֹת. הַמִּסְפָּר הַמַּתְאִים הוּא:"
    tasks:
      - { type: count, item: hand,   count: 5, options: [4, 5, 6] }
      - { type: count, item: tooth,  count: 6, options: [5, 6, 7] }
      - { type: count, item: leg,    count: 8, options: [7, 8, 9] }
      - { type: count, item: finger, count: 7, options: [6, 7, 8] }
    encouraging_message: "כְּשֶׁסּוֹפְרִים בִּזְהִירוּת וּמַתְמִידִים, מַגִּיעִים לַמִּסְפָּר הַנָּכוֹן."
    quick_check:
      type: write_count
      groups:
        - { item: finger, count: 6, line: "סִפְרוּ וְכִתְבוּ: יֵשׁ כָּאן ___ אֶצְבָּעוֹת." }
    success_reflection: [tried, improved, persevered]
    bonus:
      type: find_count
      target: 5
      text: "מִצְאוּ צִיּוּר אֶחָד שֶׁבּוֹ יֵשׁ בְּדִיּוּק 5 חֲלָקִים."
    footer: "בְּנִיקָה מַתְמִידִים — סוֹפְרִים, מַקְשִׁיבִים לַגּוּף וְשׁוֹמְרִים עָלָיו."

  # ── עמוד 2 · ממשיכים · השוואה + כתיבה ─────────────────────────────
  mid:
    level: mid
    intro: "עַכְשָׁיו נִבְדֹּק כַּמָּה חֲלָקִים יֵשׁ, וְנִרְאֶה אֵיפֹה יֵשׁ יוֹתֵר וְאֵיפֹה יֵשׁ פָּחוֹת."
    instruction: "סִפְרוּ, כִּתְבוּ אֶת הַמִּסְפָּרִים, וְסַמְּנוּ אֵיפֹה יֵשׁ יוֹתֵר אוֹ פָּחוֹת."
    example:
      type: compare
      item: finger
      a: 4
      b: 3
      ask: more
      caption: "בִּקְבוּצָה א׳ יֵשׁ 4 אֶצְבָּעוֹת, בִּקְבוּצָה ב׳ יֵשׁ 3. בִּקְבוּצָה א׳ יֵשׁ יוֹתֵר."
    tasks:
      - type: write_count
        groups:
          - { item: hand, count: 5, line: "בִּקְבוּצָה א׳ יֵשׁ ___" }
          - { item: hand, count: 3, line: "בִּקְבוּצָה ב׳ יֵשׁ ___" }
      - { type: compare, item: tooth, a: 5, b: 3, ask: more }
      - { type: compare, item: leg,   a: 4, b: 6, ask: less }
      - type: write_count
        groups:
          - { item: finger, count: 5, line: "יֵשׁ ___ אֶצְבָּעוֹת" }
          - { item: tooth,  count: 6, line: "יֵשׁ ___ שִׁנַּיִם" }
      - type: match
        prompt: "חַבְּרוּ בְּקַו בֵּין כָּל קְבוּצָה לַמִּסְפָּר הַמַּתְאִים."
        pairs:
          - { item: hand,   count: 2, label: "קְבוּצָה א׳" }
          - { item: leg,    count: 4, label: "קְבוּצָה ב׳" }
          - { item: finger, count: 5, label: "קְבוּצָה ג׳" }
        numbers: [4, 2, 5]
    encouraging_message: "כְּשֶׁמַּתְמִידִים וּבוֹדְקִים לְאַט — סוֹפְרִים נָכוֹן וְלֹא מִתְבַּלְבְּלִים."
    quick_check:
      type: compare
      item: tooth
      a: 5
      b: 3
      ask: more
      line: "סַמְּנוּ: לְאֵיזוֹ קְבוּצָה יֵשׁ יוֹתֵר שִׁנַּיִם?"
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      title: "אֶתְגָּר זוּגִי"
      text: "בִּדְקוּ עִם חָבֵר אוֹ חֲבֵרָה אִם סְפַרְתֶּם אוֹתוֹ דָּבָר."
    footer: "בְּנִיקָה מִתְקַדְּמִים יַחַד — סוֹפְרִים, בּוֹדְקִים וּמַתְמִידִים."

  # ── עמוד 3 · אתגר · חיבור/חיסור + השלמה ─────────────────────────────
  challenge:
    level: challenge
    intro: "עַכְשָׁיו נַחְשֹׁב עַל תַּרְגִּילֵי הִתְעַמְּלוּת — נְחַבֵּר, נְחַסֵּר וְנַשְׁלִים."
    instruction: "סִפְרוּ, חִשְׁבוּ, וְהַשְׁלִימוּ אֶת הַתְּשׁוּבוֹת."
    example:
      type: arith
      op: addition
      a: { item: hand, count: 4 }
      b: { item: hand, count: 3 }
      result: 7
      caption: "4 יְלָדִים הֵרִימוּ יָד, וְעוֹד 3. כַּמָּה יָדַיִם מוּרָמוֹת?"
    tasks:
      - type: arith
        op: addition
        a: { item: finger, count: 4 }
        b: { item: finger, count: 2 }
        result: 6
        prompt: "הֶרְאֵיתִי 4 אֶצְבָּעוֹת, וְעוֹד 2. כַּמָּה אֶצְבָּעוֹת בְּיַחַד?"
      - type: arith
        op: subtraction
        a: { item: tooth, count: 6 }
        b: { item: tooth, count: 2 }
        result: 4
        prompt: "הָיוּ 6 שִׁנַּיִם, 2 נָפְלוּ. כַּמָּה שִׁנַּיִם נִשְׁאֲרוּ?"
      - type: equalize
        item: hand
        a: 5
        b: 3
        answer: 2
        prompt: "בִּקְבוּצָה א׳ 5 יָדַיִם מוּרָמוֹת, בִּקְבוּצָה ב׳ 3. כַּמָּה לְהוֹסִיף כְּדֵי שֶׁיִּהְיֶה שָׁוֶה?"
    encouraging_message: "הַתְמָדָה עוֹזֶרֶת לָנוּ לְחַשֵּׁב נָכוֹן וְלִשְׁמֹר עַל הַגּוּף — יָפֶה שֶׁהִתְאַמַּצְתֶּם."
    quick_check:
      type: arith
      op: addition
      a: { item: finger, count: 3 }
      b: { item: finger, count: 2 }
      result: 5
      prompt: "כִּתְבוּ: 3 אֶצְבָּעוֹת וְעוֹד 2 — כַּמָּה בְּיַחַד?"
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "הַמְצִיאוּ תַּרְגִּיל חִבּוּר עַל חֶלְקֵי גּוּף."
    footer: "בְּנִיקָה אֲנַחְנוּ מִתְקַדְּמִים — כָּל יוֹם צַעַד קָטָן קָדִימָה, בְּיַחַד."

  # ── דף מדריך/ה (ללא ניקוד) ─────────────────────────────
  coach_guide:

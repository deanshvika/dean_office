      - "השוואת כמויות (יותר/פחות)"
      - "חיבור וחיסור עד 10"
      - "השלמה לשוויון בין קבוצות"
    leading_value:
      name: "התמדה"
      text: "ספירה מדויקת דורשת סבלנות והתמדה — כמו לשמור על הגוף: צעד אחר צעד, כל יום."
    pages_overview:
      - level: beginner
        audience: "מיועד לילדים שצריכים כניסה פשוטה ובטוחה:"
        points: ["ספירה עד 10", "התאמת כמות למספר", "סימון התשובה הנכונה"]
      - level: mid
        audience: "מיועד לילדים שיכולים:"
        points: ["לספור באופן עצמאי", "לכתוב מספר", "להשוות יותר/פחות ולחבר בקו"]
      - level: challenge
        audience: "מיועד לילדים שיכולים:"
        points: ["לחבר ולחסר עד 10", "לפתור בעיה מילולית קצרה", "להבין מה חסר כדי להגיע לשוויון"]

# ── מחזור 1 · יום 1 · חשבון · שכבה א' ─────────────────────────────
# עולם תוכן: ספורט וקבוצה | ערך: אחריות קבוצתית
# דרגות קושי (מנגנון שונה): מתחילים=מנייה · ממשיכים=השוואה+כתיבה · אתגר=חיבור/חיסור+השלמה
# ★ חשבון שכבה א' = מנוקד (בקשת חי). כל טקסט עברי בעמודי התלמיד מנוקד; דף מדריך = ללא ניקוד.
# פריטים מגוונים (#6): bottle/ball/cone/net/medal/cup/hoop/flag. טווח א' = עד 10.

day_id: grade_1_math_day_1
subject: math
audience: grade_1
niqqud: true
day_label: "יוֹם 1 – מְנִיָּה וְכַמּוּת"
title: "כַּמָּה צִיּוּד צָרִיךְ לַקְּבוּצָה?"
core_skill: "מנייה, השוואה ותחילת חיבור/חיסור"
subskills:
  - "ספירה עד 10"
  - "השוואת כמויות (יותר/פחות)"
  - "חיבור/חיסור והשלמה לשוויון"
theme: "ספורט וקבוצה"
leading_value: "אחריות קבוצתית"

pages:

  # ── עמוד 1 · מתחילים · מנייה ─────────────────────────────
  beginner:
    level: beginner
    intro: "הַקְּבוּצָה מִתְכּוֹנֶנֶת לִפְעִילוּת. כְּדֵי שֶׁכֻּלָּם יִשְׁתַּתְּפוּ — צָרִיךְ לִסְפֹּר שֶׁיִּהְיֶה מַסְפִּיק צִיּוּד לְכֻלָּם."
    instruction: "סִפְרוּ אֶת הַפְּרִיטִים וְסַמְּנוּ אֶת הַמִּסְפָּר הַמַּתְאִים."
    example:
      type: count
      item: bottle
      count: 4
      caption: "יֵשׁ 4 בַּקְבּוּקִים. הַמִּסְפָּר הַמַּתְאִים הוּא:"
    tasks:
      - { type: count, item: ball,  count: 5, options: [4, 5, 6] }
      - { type: count, item: cone,  count: 6, options: [5, 6, 7] }
      - { type: count, item: net,   count: 8, options: [7, 8, 9] }
      - { type: count, item: medal, count: 7, options: [6, 7, 8] }
    encouraging_message: "כְּשֶׁכָּל אֶחָד סוֹפֵר בִּזְהִירוּת, הַקְּבוּצָה יוֹדַעַת שֶׁלֹּא חָסֵר כְּלוּם לְאַף אֶחָד."
    quick_check:
      type: write_count
      groups:
        - { item: bottle, count: 6, line: "סִפְרוּ וְכִתְבוּ: יֵשׁ כָּאן ___ בַּקְבּוּקִים." }
    success_reflection: [tried, improved, persevered]
    bonus:
      type: find_count
      target: 5
      text: "מִצְאוּ צִיּוּר אֶחָד שֶׁבּוֹ יֵשׁ בְּדִיּוּק 5 פְּרִיטִים."
    footer: "בְּנִיקָה אֲנַחְנוּ לוֹקְחִים אַחְרָיוּת — סוֹפְרִים, מְדַיְּקִים וְדוֹאֲגִים לְכָל הַקְּבוּצָה."

  # ── עמוד 2 · ממשיכים · השוואה + כתיבה ─────────────────────────────
  mid:
    level: mid
    intro: "עַכְשָׁיו נִבְדֹּק כַּמָּה צִיּוּד יֵשׁ בְּכָל קְבוּצָה, וְנִרְאֶה אֵיפֹה יֵשׁ יוֹתֵר וְאֵיפֹה יֵשׁ פָּחוֹת."
    instruction: "סִפְרוּ, כִּתְבוּ אֶת הַמִּסְפָּרִים, וְסַמְּנוּ אֵיפֹה יֵשׁ יוֹתֵר אוֹ פָּחוֹת."
    example:
      type: compare
      item: bottle
      a: 4
      b: 3
      ask: more
      caption: "בִּקְבוּצָה א׳ יֵשׁ 4 בַּקְבּוּקִים, בִּקְבוּצָה ב׳ יֵשׁ 3. בִּקְבוּצָה א׳ יֵשׁ יוֹתֵר."
    tasks:
      - type: write_count
        groups:
          - { item: cup, count: 5, line: "בִּקְבוּצָה א׳ יֵשׁ ___" }
          - { item: cup, count: 3, line: "בִּקְבוּצָה ב׳ יֵשׁ ___" }
      - { type: compare, item: ball, a: 5, b: 3, ask: more }
      - { type: compare, item: hoop, a: 4, b: 6, ask: less }
      - type: write_count
        groups:
          - { item: flag, count: 5, line: "יֵשׁ ___ דְּגָלִים" }
          - { item: net,  count: 6, line: "יֵשׁ ___ רְשָׁתוֹת" }
      - type: match
        prompt: "חַבְּרוּ בְּקַו בֵּין כָּל קְבוּצָה לַמִּסְפָּר הַמַּתְאִים."
        pairs:
          - { item: bottle, count: 2, label: "קְבוּצָה א׳" }
          - { item: medal,  count: 4, label: "קְבוּצָה ב׳" }
          - { item: ball,   count: 5, label: "קְבוּצָה ג׳" }
        numbers: [4, 2, 5]
    encouraging_message: "כְּשֶׁאֲנַחְנוּ בּוֹדְקִים בְּיַחַד מִי צָרִיךְ עוֹד — אַף אֶחָד לֹא נִשְׁאָר בְּלִי צִיּוּד."
    quick_check:
      type: compare
      item: ball
      a: 5
      b: 3
      ask: more
      line: "סַמְּנוּ: לְאֵיזוֹ קְבוּצָה יֵשׁ יוֹתֵר כַּדּוּרִים?"
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      title: "אֶתְגָּר זוּגִי"
      text: "בִּדְקוּ עִם חָבֵר אוֹ חֲבֵרָה אִם סְפַרְתֶּם אוֹתוֹ דָּבָר."
    footer: "בְּנִיקָה מִתְקַדְּמִים יַחַד — סוֹפְרִים, בּוֹדְקִים וְדוֹאֲגִים שֶׁלְּכֻלָּם יִהְיֶה."

  # ── עמוד 3 · אתגר · חיבור/חיסור + השלמה ─────────────────────────────
  challenge:
    level: challenge
    intro: "עַכְשָׁיו נַחְשֹׁב כְּמוֹ קְבוּצָה שֶׁאַחְרָאִית לַצִּיּוּד — נְחַבֵּר, נְחַסֵּר וְנַשְׁלִים כְּדֵי שֶׁיִּהְיֶה שָׁוֶה לְכֻלָּם."
    instruction: "סִפְרוּ, חִשְׁבוּ, וְהַשְׁלִימוּ אֶת הַתְּשׁוּבוֹת."
    example:
      type: arith
      op: addition
      a: { item: bottle, count: 4 }
      b: { item: bottle, count: 3 }
      result: 7
      caption: "בִּקְבוּצָה א׳ 4 בַּקְבּוּקִים, בִּקְבוּצָה ב׳ 3. כַּמָּה בַּקְבּוּקִים יֵשׁ בְּיַחַד?"
    tasks:
      - type: arith
        op: addition
        a: { item: ball, count: 4 }
        b: { item: ball, count: 2 }
        result: 6
        prompt: "בִּקְבוּצָה א׳ 4 כַּדּוּרִים, בִּקְבוּצָה ב׳ 2. כַּמָּה כַּדּוּרִים יֵשׁ בְּיַחַד?"
      - type: arith
        op: subtraction
        a: { item: cone, count: 6 }
        b: { item: cone, count: 2 }
        result: 4
        prompt: "הָיוּ 6 קוֹנוּסִים, לָקְחוּ 2 לַפְּעִילוּת. כַּמָּה קוֹנוּסִים נִשְׁאֲרוּ?"
      - type: equalize
        item: flag
        a: 5
        b: 3
        answer: 2
        prompt: "בִּקְבוּצָה א׳ 5 דְּגָלִים, בִּקְבוּצָה ב׳ 3. כַּמָּה דְּגָלִים לְהוֹסִיף לִקְבוּצָה ב׳ כְּדֵי שֶׁיִּהְיֶה שָׁוֶה?"
    encouraging_message: "לָקַחַת אַחְרָיוּת זֶה גַּם לִדְאֹג שֶׁלְּכָל קְבוּצָה יִהְיֶה מִסְפָּר שָׁוֶה — יָפֶה שֶׁחֲשַׁבְתֶּם עַל כֻּלָּם."
    quick_check:
      type: arith
      op: addition
      a: { item: bottle, count: 3 }
      b: { item: bottle, count: 2 }
      result: 5
      prompt: "כִּתְבוּ: 3 בַּקְבּוּקִים וְעוֹד 2 בַּקְבּוּקִים — כַּמָּה בְּיַחַד?"
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "הַמְצִיאוּ שְׁאֵלָה חֲדָשָׁה עַל אֶחָד הָאִיּוּרִים בַּדַּף."
    footer: "בְּנִיקָה אֲנַחְנוּ מִתְקַדְּמִים — כָּל יוֹם צַעַד קָטָן קָדִימָה, בְּיַחַד."

  # ── דף מדריך/ה (ללא ניקוד) ─────────────────────────────
  coach_guide:

# ── מחזור 3 · יום 8 · שפה · שכבות ב-ג ─────────────────────────────
# עולם תוכן: גוף ובריאות | ערך: התמדה והקשבה לגוף
# שכבות ב-ג = ללא ניקוד. מתחילים=תמונה→מילה · ממשיכים=בחירת מילה למשפט · אתגר=הבנת הנקרא
# ★ פריטי-אימוג'י (חלקי גוף): עברית על עין/אוזן/אף/רגל/לשון.

day_id: grades_2_3_language_day_8
subject: language
audience: grades_2_3
niqqud: false
day_label: "יום 8 – הגוף: קריאה, משפט והבנה"
title: "הגוף שלי עובד בשבילי"
core_skill: "קריאה שוטפת, בחירת מילה למשפט והבנת הנקרא"
subskills:
  - "קריאת שם חלק גוף והתאמתו לתמונה"
  - "בחירת המילה הנכונה למשפט"
  - "הבנת קטע קצר על הגוף והבריאות"
theme: "גוף ובריאות"
leading_value: "התמדה"

pages:

  # ── עמוד 1 · מתחילים · תמונה → מילה (4 אפשרויות) ──────
  beginner:
    level: beginner
    intro: "בשכבות ב-ג קוראים בלי ניקוד. הסתכלו על חלק הגוף ובחרו את שמו הנכון מבין ארבע."
    instruction: "הסתכלו על התמונה ובחרו את המילה המתאימה."
    example:
      type: pic_word
      item: eye
      distractors: [ear, nose, leg]
      caption: "בוחרים את המילה המתאימה לתמונה."
    tasks:
      - { type: pic_word, item: ear,    distractors: [eye, leg, nose] }
      - { type: pic_word, item: nose,   distractors: [leg, eye, ear] }
      - { type: pic_word, item: leg,    distractors: [tongue, ear, eye] }
      - { type: pic_word, item: tongue, distractors: [nose, leg, ear] }
    encouraging_message: "כשמכירים את שמות חלקי הגוף, קל יותר לספר עליהם ולשמור עליהם."
    quick_check:
      type: pic_word
      item: nose
      distractors: [eye, ear, leg]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "כתבו שני חלקי גוף שאתם מכירים."
    footer: "בניקה מתקדמים יחד — קוראים, מנסים ומתמידים."

  # ── עמוד 2 · ממשיכים · בחירת מילה למשפט ─────────────────────────────
  mid:
    level: mid
    intro: "עכשיו נשלים משפטים על הגוף. בחרו את המילה שמתאימה לכל משפט."
    instruction: "קראו את המשפט ובחרו מהמילים את המילה הנכונה."
    example:
      type: complete_sentence
      sentence: "רואים את העולם עם ה___."
      word_bank: [עיניים, אוזניים, רגליים]
      answer: עיניים
      item: eye
      caption: "המילה המתאימה: עיניים."
    tasks:
      - { type: complete_sentence, sentence: "שומעים מוזיקה עם ה___.", word_bank: [אוזניים, עיניים, אף], answer: אוזניים, item: ear }
      - { type: complete_sentence, sentence: "מריחים פרח עם ה___.",   word_bank: [אף, פה, יד],       answer: אף,      item: nose }
      - { type: complete_sentence, sentence: "הולכים ורצים על ה___.", word_bank: [רגליים, ידיים, אוזניים], answer: רגליים, item: leg }
    encouraging_message: "כשאנחנו קוראים בהתמדה ובוחרים בזהירות, לומדים מהר יותר."
    quick_check:
      type: complete_sentence
      sentence: "טועמים את האוכל עם ה___."
      word_bank: [לשון, אף, עין]
      answer: לשון
      item: tongue
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "כתבו משפט אחד על חלק גוף ומה הוא עושה."
    footer: "בניקה מתקדמים יחד — קוראים, בוחרים ומתמידים."

  # ── עמוד 3 · אתגר · הבנת הנקרא ─────────────────────────────
  challenge:
    level: challenge
    intro: "עכשיו נקרא קטעים קצרים על הגוף ועל התמדה, ונענה על שאלה בכל קטע."
    instruction: "קראו את הקטע וסמנו את התשובה הנכונה."
    example:
      type: reading_comprehension
      passage: "דני התעמל כל בוקר. הוא רץ, קפץ, ושמר על גוף חזק ובריא."
      question: "מה עשה דני כל בוקר?"
      options: [התעמל, ישן, צפה בטלוויזיה]
      answer: התעמל
    tasks:
      - type: reading_comprehension
        passage: "מאיה שברה אצבע במשחק. הרופא שם תחבושת, והיא נחה עד שהחלימה."
        question: "מה עשה הרופא?"
        options: [שם תחבושת, צחק, ברח]
        answer: שם תחבושת
      - type: reading_comprehension
        passage: "כדי לשמור על שיניים בריאות, יוסי מצחצח פעמיים ביום. השיניים שלו נקיות וחזקות."
        question: "למה השיניים של יוסי בריאות?"
        options: [כי הוא מצחצח פעמיים ביום, כי הוא אוכל ממתקים, כי הוא שוכח לצחצח]
        answer: כי הוא מצחצח פעמיים ביום
    encouraging_message: "כשמבינים מה קראנו ומתמידים לשמור על הגוף, נעשים בריאים וחזקים יותר."
    quick_check:
      type: reading_comprehension
      passage: "רותם התעייפה באימון אבל לא ויתרה. היא נחה רגע והמשיכה עד הסוף."
      question: "מה עשתה רותם כשהתעייפה?"
      options: [לא ויתרה והמשיכה, הלכה הביתה, כעסה]
      answer: לא ויתרה והמשיכה
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "כתבו משפט אחד: איך אתם שומרים על גוף בריא?"
    footer: "בניקה אנחנו מתקדמים — כל יום צעד קטן קדימה, ביחד."


# ── מחזור 6 · יום 17 · שפה · שכבה א' ─────────────────────────────
# עולם תוכן: טבע וסביבה | ערך: אחריות סביבתית
# דרגות קושי: מתחילים=מילה→תמונה · ממשיכים=תמונה→מילה · אתגר=אות חסרה
# ★ בידול מ"אנגלית": עברית על סט פרח/עלה/ענן/קשת/יער (אנגלית על sun/star/moon/rain/tree).
# שפה שכבה א' = ניקוד מלא; מילים ואותיות מהבנק המנוקד.

day_id: grade_1_language_day_17
subject: language
audience: grade_1
niqqud: true
day_label: "יוֹם 17 – טֶבַע: מִלָּה, תְּמוּנָה וְאוֹת"
title: "שׁוֹמְרִים עַל הַטֶּבַע"
core_skill: "זיהוי מילה, קריאתה, וניתוח האות החסרה — בעולם הטבע"
subskills:
  - "התאמת מילה לתמונה מהטבע"
  - "קריאת מילה ובחירתה"
  - "זיהוי אות חסרה במילה"
theme: "טבע וסביבה"
leading_value: "אחריות סביבתית"

pages:

  # ── עמוד 1 · מתחילים · מילה → תמונה ─────────────────────────────
  beginner:
    level: beginner
    intro: "בַּטֶּבַע יֵשׁ הַרְבֵּה דְּבָרִים יָפִים. בּוֹאוּ נַכִּיר אוֹתָם וְנִלְמַד לִשְׁמֹר עֲלֵיהֶם."
    instruction: "קִרְאוּ אֶת הַמִּלָּה, וְהַקִּיפוּ אֶת הַתְּמוּנָה הַמַּתְאִימָה."
    example:
      type: word_picture
      item: flower
      distractors: [forest, leaf]
      caption: "מַקִּיפִים אֶת הַתְּמוּנָה הַמַּתְאִימָה."
    tasks:
      - { type: word_picture, item: leaf,    distractors: [flower, cloud] }
      - { type: word_picture, item: cloud,   distractors: [rainbow, leaf] }
      - { type: word_picture, item: rainbow, distractors: [forest, flower] }
      - { type: word_picture, item: forest,  distractors: [cloud, rainbow] }
    encouraging_message: "כְּשֶׁאֲנַחְנוּ מַכִּירִים אֶת הַטֶּבַע, אֲנַחְנוּ יוֹדְעִים לִשְׁמֹר עָלָיו."
    quick_check:
      type: word_picture
      item: flower
      distractors: [cloud, forest]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "הַרְאוּ דָּבָר אֶחָד מֵהַטֶּבַע וְאִמְרוּ אֶת הַשֵּׁם שֶׁלּוֹ."
    footer: "בְּנִיקָה מִתְקַדְּמִים יַחַד — קוֹרְאִים, מְנַסִּים וְשׁוֹמְרִים עַל הַטֶּבַע."

  # ── עמוד 2 · ממשיכים · תמונה → מילה ─────────────────────────────
  mid:
    level: mid
    intro: "עַכְשָׁיו נִסְתַּכֵּל עַל הַתְּמוּנָה וְנִבְחַר אֶת הַמִּלָּה הַנְּכוֹנָה."
    instruction: "הִסְתַּכְּלוּ עַל הַתְּמוּנָה וְסַמְּנוּ אֶת הַמִּלָּה הַמַּתְאִימָה."
    example:
      type: pic_word
      item: flower
      distractors: [forest, cloud]
      caption: "בּוֹחֲרִים אֶת הַמִּלָּה הַמַּתְאִימָה לַתְּמוּנָה."
    tasks:
      - { type: pic_word, item: leaf,    distractors: [flower, forest] }
      - { type: pic_word, item: cloud,   distractors: [rainbow, leaf] }
      - { type: pic_word, item: rainbow, distractors: [flower, cloud] }
      - { type: pic_word, item: forest,  distractors: [leaf, rainbow] }
    encouraging_message: "כְּשֶׁאֲנַחְנוּ מְנַסִּים שׁוּב וְלוֹקְחִים אַחְרָיוּת, אֲנַחְנוּ לוֹמְדִים וּמִתְקַדְּמִים."
    quick_check:
      type: pic_word
      item: cloud
      distractors: [flower, forest]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "אִמְרוּ מִלָּה מֵהַטֶּבַע לְחָבֵר, וּבִדְקוּ אִם מָצָא אוֹתָהּ."
    footer: "בְּנִיקָה מִתְקַדְּמִים יַחַד — מְנַסִּים, שׁוֹמְרִים וְלוֹמְדִים."

  # ── עמוד 3 · אתגר · אות חסרה ─────────────────────────────
  challenge:
    level: challenge
    intro: "עַכְשָׁיו נִמְצָא אֵיזוֹ אוֹת חֲסֵרָה בַּמִּלָּה, וְנַשְׁלִים אוֹתָהּ."
    instruction: "הַשְׁלִימוּ אֶת הָאוֹת הַחֲסֵרָה בְּכָל מִלָּה."
    example:
      type: missing_letter
      item: flower
      answer: "ר"
      options: ["ר", "מ", "ת"]
      caption: "מַשְׁלִימִים אֶת הָאוֹת הַחֲסֵרָה בַּמִּלָּה."
    tasks:
      - { type: missing_letter, item: leaf,    answer: "ל", options: ["ל", "מ", "ס"] }
      - { type: missing_letter, item: cloud,   answer: "נ", options: ["נ", "מ", "ל"] }
      - { type: missing_letter, item: rainbow, answer: "ש", options: ["ש", "מ", "ל"] }
    encouraging_message: "מַאֲמָץ, קְרִיאָה וְאַחְרָיוּת עוֹזְרִים לָנוּ לְהִשְׁתַּפֵּר בְּכָל יוֹם."
    quick_check:
      type: missing_letter
      item: forest
      answer: "ע"
      options: ["ע", "מ", "ת"]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "הַמְצִיאוּ מִשְׁפָּט קָצָר עַל אֵיךְ שׁוֹמְרִים עַל הַטֶּבַע."
    footer: "בְּנִיקָה אֲנַחְנוּ מִתְקַדְּמִים — כָּל יוֹם צַעַד קָטָן קָדִימָה."

  # ── דף מדריך/ה (ללא ניקוד) ─────────────────────────────
  coach_guide:
    daily_goal:
      - "התאמת שם פריט טבע לתמונה (זיהוי)"
      - "בחירת המילה הנכונה לפי תמונה (קריאה)"
      - "זיהוי והשלמת אות חסרה (ניתוח)"
      - "חיזוק הקשר בין צליל, אות ומילה"
    leading_value:
      name: "אחריות סביבתית"
      text: "היכרות עם הטבע מחזקת אחריות — לומדים שכל אחד יכול לשמור על הסביבה: לא לזרוק פסולת, לשתול ולטפח."
    pages_overview:
      - level: beginner
        audience: "מיועד לילדים שצריכים כניסה פשוטה:"
        points: ["שמיעת מילה", "זיהוי פריט הטבע המתאים", "בחירה בין 3 אפשרויות"]
      - level: mid
        audience: "מיועד לילדים שיכולים:"
        points: ["להסתכל על תמונה ולקרוא", "לבחור את המילה הנכונה", "להבחין בין מילים דומות"]
      - level: challenge
        audience: "מיועד לילדים שיכולים:"
        points: ["לקרוא מילה בביטחון יחסי", "לזהות איזו אות חסרה", "להשלים את המילה"]
    how_to_mediate:
      - "לפתוח תמיד מהפתיח ומהדוגמה"
      - "לומר את שם הפריט בקול ברור ולבקש מהילד לחזור"
      - "בעמוד האות החסרה — לקרוא את המילה בלי האות ולשאול 'איזה צליל חסר?'"
      - "לחבר לערך: 'איך שומרים על הדבר הזה בטבע?'"
      - "אם צריך, להישאר רק בעמוד 'מתחילים'"
    adaptations:
      - "להציג משימה אחת בכל פעם"
      - "לומר את המילה בקול שוב ושוב"
      - "להשתמש בכרטיסיות מילה/אות נפרדות"
      - "להקטין מספר אפשרויות אם צריך"
      - "לאפשר תשובה בהצבעה או בעל פה"
    fast_finishers:
      - "לעבור ל'אתגר'"
      - "לתת את הבונוס"
      - "לבקש לומר שם פריט טבע נוסף"
      - "לבקש לייצר משפט קצר מאוד"
    coach_message:
      lead: "הדגש הוא לא על 'קריאה מושלמת', אלא על:"
      values: ["אחריות סביבתית", "קריאה", "חזרתיות", "ביטחון"]
    phrases:
      - "כל הכבוד שקראת."
      - "יפה ששמרת על הטבע."
      - "מצאת את האות החסרה."
      - "קראת שוב וזה מעולה."
      - "התקדמת יפה."
    footer_legend: ["אחריות סביבתית", "קריאה", "חזרתיות", "ביטחון", "תחושת הצלחה"]

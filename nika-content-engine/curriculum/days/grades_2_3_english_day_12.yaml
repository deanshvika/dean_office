# ── מחזור 4 · יום 12 · אנגלית · שכבות ב-ג ─────────────────────────────
# עולם תוכן: אוכל בריא | ערך: שיתוף
# ב-ג: מתחילים=picture→word(4) · ממשיכים=spell_choice · אתגר=complete sentence
# בידול מ"שפה": אנגלית על סט milk/egg/grapes/orange/cheese. איות שגוי = אי-מילה ברורה.
# שכבות ב-ג = ללא ניקוד (הוראות עברית plain; אנגלית plain). פריטי-אימוג'י מהבנק.

day_id: grades_2_3_english_day_12
subject: english
audience: grades_2_3
niqqud: false
day_label: "יום 12 – Food: Words and Spelling"
title: "Share healthy food"
core_skill: "אוצר אוכל באנגלית, זיהוי מילה, איות נכון והשלמת משפט"
subskills:
  - "זיהוי שם מאכל לפי תמונה (4 אפשרויות)"
  - "בחירת האיות הנכון של שם מאכל"
  - "השלמת משפט מבנק מילים"
theme: "אוכל בריא"
leading_value: "שיתוף"

pages:

  # ── עמוד 1 · מתחילים · picture → word (4 אפשרויות) ─────────
  beginner:
    level: beginner
    intro: "בשכבות ב-ג מרחיבים את אוצר האוכל באנגלית. הסתכלו על המאכל ובחרו את המילה הנכונה מבין ארבע."
    instruction: "Look at the food and choose the correct word (4 choices)."
    example:
      type: pic_word
      item: milk
      distractors: [egg, orange, cheese]
      caption: "Choose the word: milk"
    tasks:
      - { type: pic_word, item: egg,    distractors: [milk, grapes, cheese] }
      - { type: pic_word, item: orange, distractors: [cheese, egg, milk] }
      - { type: pic_word, item: grapes, distractors: [milk, orange, egg] }
      - { type: pic_word, item: cheese, distractors: [milk, egg, grapes] }
    encouraging_message: "In NIKA everyone shares. Everyone can learn new words."
    quick_check:
      type: pic_word
      item: orange
      distractors: [milk, egg, cheese]
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "Write two English food words you know."
    footer: "בניקה מתקדמים יחד — לומדים, מנסים ומשתפים."

  # ── עמוד 2 · ממשיכים · spell_choice ─────────────
  mid:
    level: mid
    intro: "עכשיו נקרא בדיוק: לכל מאכל נבחר את המילה שכתובה נכון באנגלית."
    instruction: "Look at the food. Choose the word that is spelled correctly."
    example:
      type: spell_choice
      item: milk
      options: [milk, milck, mlik]
      answer: milk
      caption: "The correct spelling is: milk"
    tasks:
      - { type: spell_choice, item: egg,    options: [egg, ega, eeg],           answer: egg }
      - { type: spell_choice, item: grapes, options: [grapes, graps, grapse],   answer: grapes }
      - { type: spell_choice, item: orange, options: [orange, orenge, ornage],  answer: orange }
      - { type: spell_choice, item: cheese, options: [cheese, chease, cheece],  answer: cheese }
    encouraging_message: "When we practice together, everyone improves — step by step."
    quick_check:
      type: spell_choice
      item: milk
      options: [milk, mikl, milkk]
      answer: milk
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "Point to a food and say the word in English to a friend."
    footer: "בניקה מתקדמים יחד — מנסים, מתמידים ומשתפים."

  # ── עמוד 3 · אתגר · complete sentence ─────────────────────────────
  challenge:
    level: challenge
    intro: "עכשיו נקרא משפט באנגלית על אוכל ונשלים אותו מתוך בנק מילים."
    instruction: "Read the sentence and choose the correct word from the word bank."
    example:
      type: complete_sentence
      sentence: "I drink ___ every morning."
      word_bank: [milk, egg, cheese]
      answer: milk
      item: milk
      caption: "The word that fits is: milk"
    tasks:
      - { type: complete_sentence, sentence: "I make fresh juice from an ___.", word_bank: [orange, milk, cheese], answer: orange, item: orange }
      - { type: complete_sentence, sentence: "I put ___ on my bread.",          word_bank: [cheese, milk, grapes], answer: cheese, item: cheese }
    encouraging_message: "Great! When everyone shares, we all find the right word."
    quick_check:
      type: complete_sentence
      sentence: "The hen lays an ___."
      word_bank: [egg, orange, milk]
      answer: egg
      item: egg
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "Write your own short sentence in English about food."
    footer: "בניקה אנחנו מתקדמים — כל יום צעד קטן קדימה, ביחד."

  # ── דף מדריך/ה ─────────────────────────────
  coach_guide:
    daily_goal:
      - "זיהוי שם מאכל לפי תמונה (4 אפשרויות)"
      - "בחירת האיות הנכון של מילה"
      - "השלמת משפט קצר מבנק מילים"
      - "קריאה ואיות מדויקים באנגלית"
    leading_value:
      name: "שיתוף"
      text: "אוכל הוא הזדמנות לשתף — לומדים את שמות המאכלים באנגלית ומתרגלים לחלוק עם החברים."
    pages_overview:
      - level: beginner
        audience: "מיועד לתלמידים שיכולים:"
        points: ["לזהות מאכל לפי תמונה", "לבחור מבין 4 אפשרויות", "אוצר אוכל מורחב"]
      - level: mid
        audience: "מיועד לתלמידים שיכולים:"
        points: ["לקרוא מילה בדיוק", "לבחור את האיות הנכון", "להבחין בין איות נכון לשגוי"]
      - level: challenge
        audience: "מיועד לתלמידים שיכולים:"
        points: ["לקרוא משפט קצר באנגלית", "לבחור מילה מבנק מילים", "להשלים משפט לפי ההקשר"]
    how_to_mediate:
      - "לפתוח תמיד מהפתיח ומהדוגמה"
      - "לומר את שם המאכל באנגלית בקול ולבקש לחזור"
      - "באיות — להשוות אות-אות בין האפשרויות ולמצוא את השגיאה"
      - "במשפט — לקרוא יחד ולבדוק איזה מאכל הגיוני"
      - "לחבר לשיתוף: 'עם מי היית חולק את המאכל הזה?'"
    adaptations:
      - "להציג משימה אחת בכל פעם"
      - "לחזור על המילה כמה פעמים"
      - "לחבר בין המילה למאכל אמיתי (להראות/להצביע)"
      - "לתת בחירה בין שתי תשובות במקום שלוש"
      - "לאפשר תשובה בהצבעה"
    fast_finishers:
      - "לעבור ל'אתגר'"
      - "לתת את הבונוס"
      - "לבקש לומר משפט קצר באנגלית על אוכל"
      - "לבקש להצביע על מאכל נוסף ולומר את שמו"
    coach_message:
      lead: "הדגש הוא לא על 'מבטא מושלם', אלא על:"
      values: ["שיתוף", "ניסיון", "חזרתיות", "ביטחון", "תחושת הצלחה"]
    phrases:
      - "Great try."
      - "You share with friends."
      - "You read it well."
      - "You helped your friend."
      - "You kept going."
    footer_legend: ["שיתוף", "ניסיון", "חזרתיות", "ביטחון", "תחושת הצלחה"]

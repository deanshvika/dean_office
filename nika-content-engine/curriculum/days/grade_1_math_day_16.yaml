# ── מחזור 6 · יום 16 · חשבון · שכבה א' ─────────────────────────────
# עולם תוכן: טבע וסביבה | ערך: שמירה על הסביבה
# דרגות קושי: מתחילים=מנייה · ממשיכים=השוואה+כתיבה · אתגר=חיבור/חיסור+השלמה
# ★ פריטי-אימוג'י (טבע) מהבנק. חשבון שכבה א' = מנוקד; דף מדריך = ללא ניקוד.

day_id: grade_1_math_day_16
subject: math
audience: grade_1
niqqud: true
day_label: "יוֹם 16 – טֶבַע: מְנִיָּה וּשְׁמִירָה"
title: "כַּמָּה יֵשׁ בַּטֶּבַע?"
core_skill: "מנייה, השוואה ותחילת חיבור/חיסור"
subskills:
  - "ספירה עד 10"
  - "השוואת כמויות (יותר/פחות)"
  - "חיבור/חיסור והשלמה לשוויון"
theme: "טבע וסביבה"
leading_value: "שמירה על הסביבה"

pages:

  # ── עמוד 1 · מתחילים · מנייה ─────────────────────────────
  beginner:
    level: beginner
    intro: "בַּגַּן וּבַטֶּבַע יֵשׁ הַרְבֵּה יֹפִי. בּוֹאוּ נִסְפֹּר וְנִשְׁמֹר עָלָיו."
    instruction: "סִפְרוּ אֶת הַפְּרִיטִים וְסַמְּנוּ אֶת הַמִּסְפָּר הַמַּתְאִים."
    example:
      type: count
      item: flower
      count: 3
      caption: "יֵשׁ 3 פְּרָחִים. הַמִּסְפָּר הַמַּתְאִים הוּא:"
    tasks:
      - { type: count, item: leaf,  count: 4, options: [3, 4, 5] }
      - { type: count, item: tree,  count: 5, options: [4, 5, 6] }
      - { type: count, item: star,  count: 6, options: [5, 6, 7] }
      - { type: count, item: flower, count: 2, options: [1, 2, 3] }
    encouraging_message: "כְּשֶׁסּוֹפְרִים בְּדִיּוּק, יוֹדְעִים כַּמָּה יֵשׁ בַּטֶּבַע וְשׁוֹמְרִים עָלָיו."
    quick_check:
      type: write_count
      groups:
        - { item: tree, count: 5, line: "סִפְרוּ וְכִתְבוּ: יֵשׁ כָּאן ___ עֵצִים." }
    success_reflection: [tried, improved, persevered]
    bonus:
      type: find_count
      target: 4
      text: "מִצְאוּ צִיּוּר אֶחָד שֶׁבּוֹ יֵשׁ בְּדִיּוּק 4 פְּרָחִים."
    footer: "בְּנִיקָה סוֹפְרִים וְשׁוֹמְרִים — טֶבַע נָקִי וְיָפֶה לְכֻלָּנוּ."

  # ── עמוד 2 · ממשיכים · השוואה + כתיבה ─────────────────────────────
  mid:
    level: mid
    intro: "עַכְשָׁיו נִבְדֹּק אֵיפֹה יֵשׁ יוֹתֵר וְאֵיפֹה פָּחוֹת — כְּדֵי לִשְׁמֹר עַל אִזּוּן בַּטֶּבַע."
    instruction: "סִפְרוּ, כִּתְבוּ אֶת הַמִּסְפָּרִים, וְסַמְּנוּ אֵיפֹה יֵשׁ יוֹתֵר אוֹ פָּחוֹת."
    example:
      type: compare
      item: flower
      a: 4
      b: 3
      ask: more
      caption: "בִּקְבוּצָה א׳ יֵשׁ 4 פְּרָחִים, בִּקְבוּצָה ב׳ יֵשׁ 3. בִּקְבוּצָה א׳ יֵשׁ יוֹתֵר."
    tasks:
      - type: write_count
        groups:
          - { item: leaf, count: 5, line: "בִּקְבוּצָה א׳ יֵשׁ ___" }
          - { item: leaf, count: 3, line: "בִּקְבוּצָה ב׳ יֵשׁ ___" }
      - { type: compare, item: tree, a: 5, b: 3, ask: more }
      - { type: compare, item: star, a: 4, b: 6, ask: less }
      - type: write_count
        groups:
          - { item: flower, count: 5, line: "יֵשׁ ___ פְּרָחִים" }
          - { item: tree,   count: 6, line: "יֵשׁ ___ עֵצִים" }
      - type: match
        prompt: "חַבְּרוּ בְּקַו בֵּין כָּל קְבוּצָה לַמִּסְפָּר הַמַּתְאִים."
        pairs:
          - { item: flower, count: 2, label: "קְבוּצָה א׳" }
          - { item: star,   count: 4, label: "קְבוּצָה ב׳" }
          - { item: leaf,   count: 5, label: "קְבוּצָה ג׳" }
        numbers: [4, 2, 5]
    encouraging_message: "כְּשֶׁבּוֹדְקִים לְאַט — סוֹפְרִים נָכוֹן וְשׁוֹמְרִים עַל הַטֶּבַע."
    quick_check:
      type: compare
      item: tree
      a: 5
      b: 3
      ask: more
      line: "סַמְּנוּ: לְאֵיזוֹ קְבוּצָה יֵשׁ יוֹתֵר עֵצִים?"
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      title: "אֶתְגָּר זוּגִי"
      text: "בִּדְקוּ עִם חָבֵר אוֹ חֲבֵרָה אִם סְפַרְתֶּם אוֹתוֹ דָּבָר."
    footer: "בְּנִיקָה מִתְקַדְּמִים יַחַד — סוֹפְרִים, בּוֹדְקִים וְשׁוֹמְרִים."

  # ── עמוד 3 · אתגר · חיבור/חיסור + השלמה ─────────────────────────────
  challenge:
    level: challenge
    intro: "עַכְשָׁיו נְחַשֵּׁב כַּמָּה שָׁתַלְנוּ יַחַד, כַּמָּה נִשְׁאֲרוּ, וְנַשְׁלִים."
    instruction: "סִפְרוּ, חַשְּׁבוּ, וְהַשְׁלִימוּ אֶת הַתְּשׁוּבוֹת."
    example:
      type: arith
      op: addition
      a: { item: tree, count: 4 }
      b: { item: tree, count: 3 }
      result: 7
      caption: "שָׁתַלְנוּ 4 עֵצִים וְעוֹד 3. כַּמָּה עֵצִים יַחַד?"
    tasks:
      - type: arith
        op: addition
        a: { item: flower, count: 4 }
        b: { item: flower, count: 2 }
        result: 6
        prompt: "בַּגִּנָּה 4 פְּרָחִים, שָׁתַלְנוּ עוֹד 2. כַּמָּה פְּרָחִים יַחַד?"
      - type: arith
        op: subtraction
        a: { item: leaf, count: 6 }
        b: { item: leaf, count: 2 }
        result: 4
        prompt: "הָיוּ 6 עָלִים, 2 נָפְלוּ. כַּמָּה עָלִים נִשְׁאֲרוּ?"
      - type: equalize
        item: tree
        a: 5
        b: 3
        answer: 2
        prompt: "בִּקְבוּצָה א׳ 5 עֵצִים, בִּקְבוּצָה ב׳ 3. כַּמָּה לְהוֹסִיף כְּדֵי שֶׁיִּהְיֶה שָׁוֶה?"
    encouraging_message: "כְּשֶׁשּׁוֹתְלִים וְשׁוֹמְרִים, הַטֶּבַע נִשְׁאָר יָרֹק וְיָפֶה — יָפֶה שֶׁחִשַּׁבְתֶּם נָכוֹן."
    quick_check:
      type: arith
      op: addition
      a: { item: star, count: 3 }
      b: { item: star, count: 2 }
      result: 5
      prompt: "כַּמָּה יַחַד: 3 כּוֹכָבִים וְעוֹד 2?"
    success_reflection: [tried, improved, persevered]
    bonus:
      type: text
      text: "הַמְצִיאוּ תַּרְגִּיל חִבּוּר עַל הַטֶּבַע שֶׁהַתְּשׁוּבָה שֶׁלּוֹ הִיא 6."
    footer: "בְּנִיקָה אֲנַחְנוּ מִתְקַדְּמִים — כָּל יוֹם צַעַד קָטָן קָדִימָה."

  # ── דף מדריך/ה (ללא ניקוד) ─────────────────────────────

    daily_goal:
      - "מנייה מדויקת של פריטי טבע עד 10"
      - "השוואת כמויות (יותר/פחות)"
      - "חיבור/חיסור והשלמה לשוויון"
      - "חיבור המספרים לשמירה על הסביבה"
    leading_value:
      name: "שמירה על הסביבה"
      text: "ספירה מדויקת עוזרת להכיר את הטבע ולשמור עליו — כשיודעים כמה עצים ופרחים יש, שומרים שלא ייעלמו."

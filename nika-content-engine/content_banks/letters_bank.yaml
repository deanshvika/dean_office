# בנק אותיות סגור — NIKA
# משמש למשימות רמת-אות בכיתה א' (נקודת-הכניסה: אות/צליל, לא מילה שלמה).
# עיקרון אפס-טעות: האות הפותחת של פריט נגזרת מהמילה המנוקדת בבנק (splitClusters),
# ולעולם אינה מוקלדת ידנית בתשובה. כאן רק אוצר האותיות הסגור לאימות.

alphabet: [א, ב, ג, ד, ה, ו, ז, ח, ט, י, כ, ל, מ, נ, ס, ע, פ, צ, ק, ר, ש, ת]

# צורות סופיות (להשלמת-אות / שימוש עתידי)
final_forms: { כ: ך, מ: ם, נ: ן, פ: ף, צ: ץ }

# זוגות אותיות דומות חזותית — לשלב האתגר בעתיד (letter_pick). לא בפיילוט.
# במתחילים אוסרים על מסיחים כאלה (צריך מסיחים מובחנים כדי שכל ילד יצליח).
confusable_pairs: [[ב, כ], [ד, ר], [ה, ח], [ו, ז], [ג, נ], [ס, ם], [כ, נ]]

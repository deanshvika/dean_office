# בנק ניקוד סגור ומאומת — NIKA
# כל ערך: plain (ללא ניקוד) + niqqud (מנוקד מלא, מאומת ידנית פעם אחת).
# המנוע שולף מכאן. ה-AI לעולם לא מנקד חופשי.
# מדיניות שימוש: language+grade_1 ו-english+grade_1 => צד עברי מנוקד. math ו-grades_2_3 => plain.
# מילים חדשות: לעבור דרך scripts/niqqud_client.mjs (Dicta Nakdan) ואז להיכנס לכאן.


# בנק ניקוד סגור ומאומת — NIKA
# כל ערך: plain (ללא ניקוד) + niqqud (מנוקד מלא, מאומת ידנית פעם אחת).
# המנוע שולף מכאן. ה-AI לעולם לא מנקד חופשי.
# מדיניות שימוש: language+grade_1 ו-english+grade_1 => צד עברי מנוקד. math ו-grades_2_3 => plain.
# מילים חדשות: לעבור דרך scripts/niqqud_client.mjs (Dicta Nakdan) ואז להיכנס לכאן.

# --- תוויות ממשק קבועות ---
ui_labels:
  what_to_do:        { plain: "מה עושים?",            niqqud: "מָה עוֹשִׂים?" }
  example:           { plain: "דוגמה",                niqqud: "דֻּגְמָה" }
  quick_check:       { plain: "בדיקה מהירה",          niqqud: "בְּדִיקָה מְהִירָה" }
  bonus:             { plain: "בונוס",                niqqud: "בּוֹנוּס" }
  bonus_champions:   { plain: "בונוס לקבוצת האלופים:", niqqud: "בּוֹנוּס לִקְבוּצַת הָאַלּוּפִים:" }
  today_success:     { plain: "היום הצלחתי כי:",       niqqud: "הַיּוֹם הִצְלַחְתִּי כִּי:" }
  complete:          { plain: "השלימו:",              niqqud: "הַשְׁלִימוּ:" }
  mark:              { plain: "סמנו:",                 niqqud: "סַמְּנוּ:" }
  write:             { plain: "כתבו:",                 niqqud: "כִּתְבוּ:" }
  word_bank:         { plain: "בנק מילים",            niqqud: "בַּנְק מִלִּים" }
  the_word:          { plain: "המילה:",               niqqud: "הַמִּלָּה:" }

# --- תוויות קבועות במשימות חשבון (לצורך ניקוד שכבה א') ---
math_labels:
  group_a:    { plain: "קבוצה א׳",        niqqud: "קְבוּצָה א׳" }
  group_b:    { plain: "קבוצה ב׳",        niqqud: "קְבוּצָה ב׳" }
  group_c:    { plain: "קבוצה ג׳",        niqqud: "קְבוּצָה ג׳" }
  in_group_a: { plain: "בקבוצה א׳ יש",    niqqud: "בִּקְבוּצָה א׳ יֵשׁ" }
  in_group_b: { plain: "בקבוצה ב׳ יש",    niqqud: "בִּקְבוּצָה ב׳ יֵשׁ" }
  more:       { plain: "יותר",            niqqud: "יוֹתֵר" }
  less:       { plain: "פחות",            niqqud: "פָּחוֹת" }
  add:        { plain: "צריך להוסיף",     niqqud: "צָרִיךְ לְהוֹסִיף" }

# --- משפטי רפלקציה (היום הצלחתי כי) ---
success_reflection:
  tried:      { plain: "ניסיתי",   niqqud: "נִסִּיתִי" }
  improved:   { plain: "השתפרתי",  niqqud: "הִשְׁתַּפַּרְתִּי" }
  persevered: { plain: "התמדתי",   niqqud: "הִתְמַדְתִּי" }

# --- רמות (badge) ---
levels:
  beginner:  { plain: "מתחילים",  niqqud: "מַתְחִילִים",  stars: 1 }
  mid:       { plain: "ממשיכים",  niqqud: "מַמְשִׁיכִים", stars: 2 }
  challenge: { plain: "אתגר",     niqqud: "אֶתְגָּר",     stars: 3 }

